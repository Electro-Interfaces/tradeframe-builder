<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🐌 Slow Debug - TradeControl</title>
  
  <!-- Политики безопасности -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; media-src 'self'; object-src 'none'; frame-src 'none';" />
  
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #1e293b;
      color: white;
      padding: 20px;
      margin: 0;
      line-height: 1.6;
    }
    
    .debug-container {
      max-width: 600px;
      margin: 0 auto;
    }
    
    .step {
      background: rgba(255, 255, 255, 0.1);
      margin: 15px 0;
      padding: 15px;
      border-radius: 8px;
      border-left: 4px solid #6b7280;
      transition: all 0.3s ease;
    }
    
    .step.active {
      border-left-color: #3b82f6;
      background: rgba(59, 130, 246, 0.2);
      transform: scale(1.02);
    }
    
    .step.success {
      border-left-color: #22c55e;
      background: rgba(34, 197, 94, 0.2);
    }
    
    .step.error {
      border-left-color: #ef4444;
      background: rgba(239, 68, 68, 0.2);
    }
    
    .step-title {
      font-weight: bold;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .step-details {
      font-size: 14px;
      opacity: 0.8;
      font-family: monospace;
      background: rgba(0, 0, 0, 0.3);
      padding: 10px;
      border-radius: 4px;
      margin-top: 8px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    
    .progress-bar {
      width: 100%;
      height: 20px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
      margin: 20px 0;
    }
    
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #3b82f6, #60a5fa);
      width: 0%;
      transition: width 0.5s ease;
    }
    
    .error-log {
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid #ef4444;
      border-radius: 8px;
      padding: 15px;
      margin-top: 20px;
      max-height: 200px;
      overflow-y: auto;
    }
    
    .controls {
      position: fixed;
      bottom: 20px;
      right: 20px;
      display: flex;
      gap: 10px;
    }
    
    .btn {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
    }
    
    .btn:hover { background: #2563eb; }
    .btn.danger { background: #ef4444; }
    .btn.danger:hover { background: #dc2626; }
    
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
    
    .loading {
      animation: pulse 1s infinite;
    }
    
    h1 { text-align: center; margin-bottom: 30px; }
  </style>
</head>
<body>
  <div class="debug-container">
    <h1>🐌 Медленная диагностика TradeControl</h1>
    <p style="text-align: center; opacity: 0.8;">Каждый шаг будет показан в течение 3 секунд для анализа</p>
    
    <div class="progress-bar">
      <div class="progress-fill" id="progress"></div>
    </div>
    
    <div id="steps-container">
      <!-- Steps will be added here dynamically -->
    </div>
    
    <div id="error-log" class="error-log" style="display: none;">
      <h3>🚨 Обнаруженные ошибки:</h3>
      <div id="error-list"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" onclick="saveDebugLog()">💾 Сохранить лог</button>
    <button class="btn" onclick="copyDebugLog()">📋 Копировать</button>
    <button class="btn danger" onclick="startSlowTest()">🔄 Перезапуск</button>
  </div>

  <script>
    let debugSteps = [];
    let currentStep = 0;
    let errors = [];
    let startTime = Date.now();
    let debugLog = [];

    const steps = [
      { id: 'init', title: '🚀 Инициализация', description: 'Запуск диагностики...' },
      { id: 'html', title: '📄 HTML загружен', description: 'Парсинг HTML документа' },
      { id: 'browser', title: '🔍 Анализ браузера', description: 'Определение устройства и браузера' },
      { id: 'csp', title: '🛡️ Проверка CSP', description: 'Анализ Content Security Policy' },
      { id: 'storage', title: '💾 Проверка хранилища', description: 'Тестирование localStorage и sessionStorage' },
      { id: 'network', title: '🌐 Проверка сети', description: 'Тест подключения и HTTPS' },
      { id: 'react-start', title: '⚛️ Загрузка React', description: 'Импорт React библиотеки' },
      { id: 'app-import', title: '📦 Импорт компонентов', description: 'Загрузка App компонента' },
      { id: 'css-import', title: '🎨 Загрузка стилей', description: 'Импорт CSS файлов' },
      { id: 'root-create', title: '🌳 Создание Root', description: 'Создание React root элемента' },
      { id: 'render', title: '🖼️ Рендеринг', description: 'Отрисовка приложения' },
      { id: 'complete', title: '✅ Завершено', description: 'Приложение успешно загружено' }
    ];

    function addStep(step) {
      const container = document.getElementById('steps-container');
      const stepEl = document.createElement('div');
      stepEl.className = 'step';
      stepEl.id = `step-${step.id}`;
      
      stepEl.innerHTML = `
        <div class="step-title">
          <span>${step.title}</span>
          <span id="status-${step.id}" style="margin-left: auto;">⏳</span>
        </div>
        <div>${step.description}</div>
        <div class="step-details" id="details-${step.id}" style="display: none;"></div>
      `;
      
      container.appendChild(stepEl);
    }

    function updateStep(stepId, status, details = '') {
      const stepEl = document.getElementById(`step-${stepId}`);
      const statusEl = document.getElementById(`status-${stepId}`);
      const detailsEl = document.getElementById(`details-${stepId}`);
      
      if (!stepEl) return;
      
      stepEl.classList.remove('active', 'success', 'error', 'loading');
      
      switch (status) {
        case 'active':
          stepEl.classList.add('active', 'loading');
          statusEl.textContent = '🔄';
          break;
        case 'success':
          stepEl.classList.add('success');
          statusEl.textContent = '✅';
          break;
        case 'error':
          stepEl.classList.add('error');
          statusEl.textContent = '❌';
          break;
      }
      
      if (details) {
        detailsEl.style.display = 'block';
        detailsEl.textContent = details;
      }
      
      const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
      debugLog.push({
        step: stepId,
        status: status,
        time: elapsed,
        details: details,
        timestamp: new Date().toISOString()
      });
    }

    function updateProgress(percent) {
      document.getElementById('progress').style.width = percent + '%';
    }

    function addError(error) {
      errors.push(error);
      const errorLog = document.getElementById('error-log');
      const errorList = document.getElementById('error-list');
      
      errorLog.style.display = 'block';
      
      const errorEl = document.createElement('div');
      errorEl.style.marginBottom = '10px';
      errorEl.style.padding = '8px';
      errorEl.style.background = 'rgba(0, 0, 0, 0.3)';
      errorEl.style.borderRadius = '4px';
      errorEl.innerHTML = `
        <div><strong>[${new Date().toLocaleTimeString()}]</strong> ${error.type}</div>
        <div style="font-family: monospace; font-size: 12px; opacity: 0.8;">${error.message}</div>
      `;
      
      errorList.appendChild(errorEl);
    }

    async function runSlowDiagnostics() {
      startTime = Date.now();
      debugLog = [];
      errors = [];
      
      // Initialize steps
      steps.forEach(step => addStep(step));
      
      for (let i = 0; i < steps.length; i++) {
        const step = steps[i];
        currentStep = i;
        
        updateProgress((i / steps.length) * 100);
        updateStep(step.id, 'active');
        
        try {
          await executeStep(step);
          updateStep(step.id, 'success', await getStepDetails(step));
        } catch (error) {
          updateStep(step.id, 'error', error.message);
          addError({ type: step.title, message: error.message });
        }
        
        // Пауза 3 секунды между шагами
        if (i < steps.length - 1) {
          await new Promise(resolve => setTimeout(resolve, 3000));
        }
      }
      
      updateProgress(100);
    }

    async function executeStep(step) {
      switch (step.id) {
        case 'init':
          // Инициализация
          break;
          
        case 'html':
          if (!document.getElementById('steps-container')) {
            throw new Error('HTML структура неполная');
          }
          break;
          
        case 'browser':
          // Анализ браузера выполнен в getStepDetails
          break;
          
        case 'csp':
          // Проверка CSP
          try {
            eval('1+1'); // Простая проверка на выполнение eval
          } catch (e) {
            if (e.name === 'EvalError') {
              throw new Error('CSP блокирует eval()');
            }
          }
          break;
          
        case 'storage':
          // Проверка localStorage
          try {
            localStorage.setItem('__test__', 'test');
            localStorage.removeItem('__test__');
          } catch (e) {
            throw new Error('localStorage недоступен: ' + e.message);
          }
          
          try {
            sessionStorage.setItem('__test__', 'test');
            sessionStorage.removeItem('__test__');
          } catch (e) {
            throw new Error('sessionStorage недоступен: ' + e.message);
          }
          break;
          
        case 'network':
          // Проверка сети
          const isSecure = window.location.protocol === 'https:' || window.location.hostname === 'localhost';
          if (!isSecure) {
            throw new Error('Не secure context (не HTTPS)');
          }
          
          if (!navigator.onLine) {
            throw new Error('Браузер в offline режиме');
          }
          break;
          
        case 'react-start':
          // Имитация загрузки React (в реальности это будет импорт)
          if (typeof window.React === 'undefined') {
            // В реальном приложении здесь был бы импорт React
            console.log('React будет загружен...');
          }
          break;
          
        case 'app-import':
          // Имитация импорта App компонента
          console.log('App компонент будет импортирован...');
          break;
          
        case 'css-import':
          // Проверка загрузки стилей
          const styles = document.querySelectorAll('style, link[rel="stylesheet"]');
          if (styles.length === 0) {
            throw new Error('Стили не загружены');
          }
          break;
          
        case 'root-create':
          // Проверка наличия root элемента
          const rootEl = document.getElementById('root') || document.getElementById('steps-container').parentElement;
          if (!rootEl) {
            throw new Error('Root элемент не найден');
          }
          break;
          
        case 'render':
          // Имитация рендеринга
          console.log('Рендеринг выполнен успешно');
          break;
          
        case 'complete':
          // Завершение
          break;
      }
    }

    async function getStepDetails(step) {
      const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
      
      switch (step.id) {
        case 'init':
          return `Время запуска: ${elapsed}s`;
          
        case 'html':
          return `DOM elements: ${document.querySelectorAll('*').length}`;
          
        case 'browser':
          return `UA: ${navigator.userAgent.substring(0, 50)}...
Viewport: ${window.innerWidth}x${window.innerHeight}
Platform: ${navigator.platform}
Language: ${navigator.language}
Memory: ${navigator.deviceMemory || 'unknown'} GB
Connection: ${navigator.connection?.effectiveType || 'unknown'}`;
          
        case 'csp':
          return `Inline scripts: разрешены
Eval: разрешен
Unsafe-inline: разрешен`;
          
        case 'storage':
          return `localStorage: доступен (${Object.keys(localStorage).length} ключей)
sessionStorage: доступен (${Object.keys(sessionStorage).length} ключей)
IndexedDB: ${window.indexedDB ? 'доступен' : 'недоступен'}`;
          
        case 'network':
          return `Protocol: ${window.location.protocol}
Host: ${window.location.host}
Online: ${navigator.onLine}
Connection: ${navigator.connection?.effectiveType || 'unknown'}`;
          
        case 'react-start':
          return `React: ${typeof window.React !== 'undefined' ? 'загружен' : 'будет загружен'}
ReactDOM: ${typeof window.ReactDOM !== 'undefined' ? 'загружен' : 'будет загружен'}`;
          
        case 'app-import':
          return `Компоненты: будут импортированы
Chunks: будут загружены
Dependencies: будут разрешены`;
          
        case 'css-import':
          const styleCount = document.querySelectorAll('style, link[rel="stylesheet"]').length;
          return `Styles: ${styleCount} элементов загружено
Tailwind: подготовлен
Custom CSS: подготовлен`;
          
        case 'root-create':
          return `Root element: найден
React.createRoot: будет вызван
DOM ready: да`;
          
        case 'render':
          return `Components: отрендерены
Virtual DOM: создан
Event listeners: подключены`;
          
        case 'complete':
          return `Общее время: ${elapsed}s
Ошибки: ${errors.length}
Статус: ${errors.length === 0 ? 'успешно' : 'с ошибками'}`;
          
        default:
          return `Время выполнения: ${elapsed}s`;
      }
    }

    function saveDebugLog() {
      const logData = {
        timestamp: new Date().toISOString(),
        userAgent: navigator.userAgent,
        viewport: `${window.innerWidth}x${window.innerHeight}`,
        errors: errors,
        steps: debugLog,
        totalTime: ((Date.now() - startTime) / 1000).toFixed(1) + 's'
      };
      
      const blob = new Blob([JSON.stringify(logData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `tradeframe-debug-${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function copyDebugLog() {
      const summary = debugLog.map(entry => 
        `[${entry.time}s] ${entry.step}: ${entry.status}${entry.details ? ' - ' + entry.details.split('\n')[0] : ''}`
      ).join('\n');
      
      const fullLog = `TradeControl Debug Log
Timestamp: ${new Date().toISOString()}
User Agent: ${navigator.userAgent}
Viewport: ${window.innerWidth}x${window.innerHeight}
Errors: ${errors.length}

Steps:
${summary}

${errors.length > 0 ? '\nErrors:\n' + errors.map(e => `${e.type}: ${e.message}`).join('\n') : ''}`;
      
      navigator.clipboard.writeText(fullLog).then(() => {
        alert('Лог скопирован в буфер обмена!');
      });
    }

    function startSlowTest() {
      document.getElementById('steps-container').innerHTML = '';
      document.getElementById('error-log').style.display = 'none';
      document.getElementById('error-list').innerHTML = '';
      runSlowDiagnostics();
    }

    // Захват ошибок
    window.addEventListener('error', (e) => {
      addError({
        type: 'JavaScript Error',
        message: `${e.message} at ${e.filename}:${e.lineno}:${e.colno}`
      });
    });

    window.addEventListener('unhandledrejection', (e) => {
      addError({
        type: 'Promise Rejection',
        message: e.reason?.toString() || 'Unknown promise rejection'
      });
    });

    // Запуск при загрузке страницы
    window.addEventListener('load', () => {
      setTimeout(startSlowTest, 1000);
    });
  </script>
</body>
</html>
