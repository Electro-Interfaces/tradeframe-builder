<!DOCTYPE html>

    <meta charset="UTF-8" />

    <title>TradeControl - Управление торговыми сетями</title>
    <meta name="description" content="Система управления торговыми сетями и АЗС. Активные разделы: обзор сетей, операции, цены, резервуары, управление пользователями. Некоторые разделы находятся в разработке." />
    <meta name="author" content="TradeControl" />
    
    <!-- Отключение кэширования для разработки -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    
    <!-- GitHub Pages SPA redirect script -->
    <script>
      // Только перенаправляем если это не главная страница и не диагностические файлы
      const path = location.pathname;
      const isDiagnostic = path.includes('mobile-') || path.includes('quick-') || path.includes('slow-') || path.includes('usb-debug');
      const isMainPage = path === '/tradeframe-builder/' || path === '/tradeframe-builder/index.html';
      
      if (!isMainPage && !isDiagnostic) {
        console.log('📍 404 redirect: storing path and redirecting', path);
        // Store the current path for the React router
        sessionStorage.setItem('redirectPath', location.pathname + location.search + location.hash);
        // Redirect to the main page
        location.replace(window.location.origin + '/tradeframe-builder/');
      } else {
        console.log('📍 404: Not redirecting, path:', path);
      }
    </script>
    
    <!-- Принудительная перезагрузка для исправления forwardRef -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
          }
        });
      }
      // Очистка кеша
      if ('caches' in window) {
        caches.keys().then(cacheNames => {
          cacheNames.forEach(cacheName => {
            caches.delete(cacheName);
          });
        });
      }
    </script>

    <!-- PWA настройки -->

      /* Глобальная защита от pull-to-refresh на мобильных устройствах */
