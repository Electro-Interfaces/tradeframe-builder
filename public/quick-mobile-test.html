<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>⚡ Quick Mobile Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f1f5f9;
      padding: 20px;
      line-height: 1.6;
    }
    
    .container { max-width: 600px; margin: 0 auto; }
    
    .header {
      text-align: center;
      margin-bottom: 30px;
      padding: 20px;
      background: linear-gradient(135deg, #1e293b, #334155);
      border-radius: 12px;
      border: 1px solid #475569;
    }
    
    .test-card {
      background: #1e293b;
      border-radius: 8px;
      padding: 15px;
      margin: 15px 0;
      border: 1px solid #334155;
      position: relative;
    }
    
    .test-card.success { border-color: #22c55e; background: rgba(34, 197, 94, 0.1); }
    .test-card.warning { border-color: #f59e0b; background: rgba(245, 158, 11, 0.1); }
    .test-card.error { border-color: #ef4444; background: rgba(239, 68, 68, 0.1); }
    
    .test-title {
      font-weight: 600;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    
    .test-result {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      background: rgba(0, 0, 0, 0.3);
      padding: 8px;
      border-radius: 4px;
      margin-top: 8px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    
    .status-icon {
      font-size: 18px;
      width: 24px;
      text-align: center;
    }
    
    .main-test {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      margin: 20px 0;
      transition: all 0.2s;
    }
    
    .main-test:hover { background: #2563eb; transform: translateY(-1px); }
    .main-test:active { transform: translateY(0); }
    
    .summary {
      background: #374151;
      padding: 15px;
      border-radius: 8px;
      margin: 20px 0;
      text-align: center;
    }
    
    .footer {
      text-align: center;
      margin-top: 30px;
      opacity: 0.7;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>⚡ Quick Mobile Test</h1>
      <p>Быстрая диагностика TradeControl на мобильном устройстве</p>
      <div id="device-info" style="font-size: 12px; margin-top: 10px; opacity: 0.8;"></div>
    </div>

    <button class="main-test" onclick="testMainApp()">🚀 Протестировать основное приложение</button>

    <div id="test-results">
      <!-- Test results will appear here -->
    </div>

    <div class="summary" id="summary" style="display: none;">
      <h3>📊 Сводка</h3>
      <div id="summary-content"></div>
    </div>

    <div class="footer">
      <p>Создано для диагностики проблем загрузки TradeControl</p>
      <p>Версия: 1.0 | Дата: <span id="current-date"></span></p>
    </div>
  </div>

  <script>
    let testResults = [];
    let startTime = Date.now();

    function addResult(testName, status, details, icon) {
      testResults.push({ testName, status, details, timestamp: Date.now() });
      
      const resultsContainer = document.getElementById('test-results');
      const testCard = document.createElement('div');
      testCard.className = `test-card ${status}`;
      
      testCard.innerHTML = `
        <div class="test-title">
          <span>${testName}</span>
          <span class="status-icon">${icon}</span>
        </div>
        ${details ? `<div class="test-result">${details}</div>` : ''}
      `;
      
      resultsContainer.appendChild(testCard);
      updateSummary();
    }

    function updateSummary() {
      const summary = document.getElementById('summary');
      const summaryContent = document.getElementById('summary-content');
      
      const total = testResults.length;
      const success = testResults.filter(r => r.status === 'success').length;
      const warnings = testResults.filter(r => r.status === 'warning').length;
      const errors = testResults.filter(r => r.status === 'error').length;
      
      summaryContent.innerHTML = `
        <div style="display: flex; justify-content: space-around; margin: 15px 0;">
          <div>✅ Успешно: ${success}</div>
          <div>⚠️ Предупреждения: ${warnings}</div>
          <div>❌ Ошибки: ${errors}</div>
        </div>
        <div style="font-size: 14px; opacity: 0.8;">
          Общее время: ${((Date.now() - startTime) / 1000).toFixed(1)}s
        </div>
      `;
      
      summary.style.display = 'block';
    }

    async function testMainApp() {
      const mainButton = document.querySelector('.main-test');
      const originalText = mainButton.textContent;
      mainButton.textContent = '🔄 Тестирование...';
      mainButton.disabled = true;
      
      document.getElementById('test-results').innerHTML = '';
      testResults = [];
      startTime = Date.now();

      // Test 1: Basic Browser Info
      try {
        const info = {
          userAgent: navigator.userAgent.substring(0, 80),
          viewport: `${window.innerWidth}x${window.innerHeight}`,
          pixelRatio: window.devicePixelRatio,
          memory: navigator.deviceMemory || 'unknown',
          connection: navigator.connection?.effectiveType || 'unknown',
          platform: navigator.platform,
          language: navigator.language,
          cookiesEnabled: navigator.cookieEnabled,
          onLine: navigator.onLine
        };
        
        addResult('📱 Информация о устройстве', 'success', 
          `UA: ${info.userAgent}...
Экран: ${info.viewport} (${info.pixelRatio}x)
Память: ${info.memory} GB
Сеть: ${info.connection}
Платформа: ${info.platform}
Язык: ${info.language}
Cookies: ${info.cookiesEnabled}
Online: ${info.onLine}`, '✅');
      } catch (e) {
        addResult('📱 Информация о устройстве', 'error', e.message, '❌');
      }

      await sleep(500);

      // Test 2: Storage
      try {
        localStorage.setItem('__mobile_test__', 'test');
        sessionStorage.setItem('__mobile_test__', 'test');
        const localKeys = Object.keys(localStorage).length;
        const sessionKeys = Object.keys(sessionStorage).length;
        
        addResult('💾 Хранилище данных', 'success', 
          `localStorage: доступен (${localKeys} ключей)
sessionStorage: доступен (${sessionKeys} ключей)
IndexedDB: ${window.indexedDB ? 'доступен' : 'недоступен'}
WebSQL: ${window.openDatabase ? 'доступен' : 'недоступен'}`, '✅');
          
        localStorage.removeItem('__mobile_test__');
        sessionStorage.removeItem('__mobile_test__');
      } catch (e) {
        addResult('💾 Хранилище данных', 'error', `Ошибка доступа к хранилищу: ${e.message}`, '❌');
      }

      await sleep(500);

      // Test 3: Network & Security
      try {
        const isSecure = location.protocol === 'https:' || location.hostname === 'localhost';
        const secureContext = window.isSecureContext;
        
        addResult('🔒 Безопасность и сеть', isSecure ? 'success' : 'warning',
          `Протокол: ${location.protocol}
Secure Context: ${secureContext}
Host: ${location.hostname}
Port: ${location.port || 'default'}
HTTPS: ${isSecure ? 'да' : 'нет'}
Service Worker: ${navigator.serviceWorker ? 'поддерживается' : 'не поддерживается'}`, isSecure ? '✅' : '⚠️');
      } catch (e) {
        addResult('🔒 Безопасность и сеть', 'error', e.message, '❌');
      }

      await sleep(500);

      // Test 4: JavaScript Capabilities
      try {
        // Test modern JS features
        const features = {
          'Async/Await': (async function() { return true; })(),
          'Fetch API': typeof fetch !== 'undefined',
          'Promises': typeof Promise !== 'undefined',
          'ES6 Modules': typeof Symbol !== 'undefined',
          'WeakMap': typeof WeakMap !== 'undefined',
          'Proxy': typeof Proxy !== 'undefined',
          'Web Workers': typeof Worker !== 'undefined',
          'WebGL': !!document.createElement('canvas').getContext('webgl'),
        };
        
        const supportedFeatures = Object.entries(features).filter(([, supported]) => supported).length;
        const totalFeatures = Object.keys(features).length;
        
        const featureList = Object.entries(features)
          .map(([feature, supported]) => `${feature}: ${supported ? '✅' : '❌'}`)
          .join('\n');
        
        const status = supportedFeatures === totalFeatures ? 'success' : 'warning';
        
        addResult('⚙️ JavaScript возможности', status,
          `Поддерживается: ${supportedFeatures}/${totalFeatures}

${featureList}`, status === 'success' ? '✅' : '⚠️');
      } catch (e) {
        addResult('⚙️ JavaScript возможности', 'error', e.message, '❌');
      }

      await sleep(500);

      // Test 5: Try to load main TradeControl app
      try {
        addResult('🚀 Тест загрузки TradeControl', 'warning', 'Попытка загрузки основного приложения...', '🔄');
        
        const testFrame = document.createElement('iframe');
        testFrame.style.display = 'none';
        testFrame.style.width = '1px';
        testFrame.style.height = '1px';
        
        const loadPromise = new Promise((resolve, reject) => {
          const timeout = setTimeout(() => {
            reject(new Error('Timeout: приложение не загрузилось за 10 секунд'));
          }, 10000);
          
          testFrame.onload = () => {
            clearTimeout(timeout);
            try {
              // Try to access the iframe content
              const doc = testFrame.contentDocument;
              const hasRoot = doc && doc.getElementById('root');
              const hasReact = testFrame.contentWindow && testFrame.contentWindow.React;
              
              resolve({
                loaded: true,
                hasRoot: !!hasRoot,
                hasReact: !!hasReact,
                title: doc ? doc.title : 'unknown',
                url: testFrame.contentWindow ? testFrame.contentWindow.location.href : 'unknown'
              });
            } catch (e) {
              // Cross-origin restrictions
              resolve({
                loaded: true,
                crossOrigin: true,
                error: e.message
              });
            }
          };
          
          testFrame.onerror = () => {
            clearTimeout(timeout);
            reject(new Error('Ошибка загрузки iframe'));
          };
        });
        
        testFrame.src = '/tradeframe-builder/';
        document.body.appendChild(testFrame);
        
        try {
          const result = await loadPromise;
          document.body.removeChild(testFrame);
          
          if (result.loaded) {
            const details = result.crossOrigin 
              ? `Приложение загружено (Cross-origin ограничения)
URL: ${result.url || 'restricted'}
Ошибка доступа: ${result.error}`
              : `Приложение загружено успешно
Заголовок: ${result.title}
Root элемент: ${result.hasRoot ? 'найден' : 'не найден'}
React: ${result.hasReact ? 'загружен' : 'не загружен'}
URL: ${result.url}`;
            
            // Update the previous test result
            const lastCard = document.querySelector('.test-card:last-child');
            lastCard.className = 'test-card success';
            lastCard.querySelector('.status-icon').textContent = '✅';
            lastCard.querySelector('.test-result').textContent = details;
            
            // Update test results array
            testResults[testResults.length - 1].status = 'success';
            testResults[testResults.length - 1].details = details;
          }
        } catch (error) {
          document.body.removeChild(testFrame);
          
          // Update the previous test result
          const lastCard = document.querySelector('.test-card:last-child');
          lastCard.className = 'test-card error';
          lastCard.querySelector('.status-icon').textContent = '❌';
          lastCard.querySelector('.test-result').textContent = `Ошибка загрузки: ${error.message}`;
          
          // Update test results array
          testResults[testResults.length - 1].status = 'error';
          testResults[testResults.length - 1].details = `Ошибка загрузки: ${error.message}`;
        }
      } catch (e) {
        addResult('🚀 Тест загрузки TradeControl', 'error', `Критическая ошибка: ${e.message}`, '❌');
      }

      await sleep(500);

      // Test 6: Memory and Performance
      try {
        const memInfo = (performance as any).memory || {};
        const navTiming = performance.timing;
        const loadTime = navTiming.loadEventEnd - navTiming.navigationStart;
        
        addResult('⚡ Производительность', loadTime < 5000 ? 'success' : 'warning',
          `Время загрузки страницы: ${loadTime}ms
Используемая память: ${Math.round((memInfo.usedJSHeapSize || 0) / 1024 / 1024)}MB
Общая память: ${Math.round((memInfo.totalJSHeapSize || 0) / 1024 / 1024)}MB
Лимит памяти: ${Math.round((memInfo.jsHeapSizeLimit || 0) / 1024 / 1024)}MB
Hardware Concurrency: ${navigator.hardwareConcurrency || 'unknown'}`, loadTime < 5000 ? '✅' : '⚠️');
      } catch (e) {
        addResult('⚡ Производительность', 'warning', `Информация недоступна: ${e.message}`, '⚠️');
      }

      mainButton.textContent = originalText;
      mainButton.disabled = false;
      updateSummary();
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    // Initialize device info
    function initDeviceInfo() {
      const info = document.getElementById('device-info');
      const isMobile = /Android|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      const isTablet = /iPad|Android(?!.*Mobile)/i.test(navigator.userAgent);
      
      let deviceType = 'Desktop';
      if (isMobile && !isTablet) deviceType = 'Mobile';
      else if (isTablet) deviceType = 'Tablet';
      
      info.textContent = `${deviceType} • ${navigator.platform} • ${window.innerWidth}x${window.innerHeight}`;
      document.getElementById('current-date').textContent = new Date().toLocaleDateString('ru-RU');
    }

    // Error tracking
    let errorCount = 0;
    window.addEventListener('error', (e) => {
      errorCount++;
      console.error('Global error:', e.error);
    });

    window.addEventListener('unhandledrejection', (e) => {
      errorCount++;
      console.error('Unhandled promise rejection:', e.reason);
    });

    // Initialize on load
    window.addEventListener('load', initDeviceInfo);
  </script>
</body>
</html>
