<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка окружения и localStorage</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        .section {
            background: #252526;
            border: 1px solid #3e3e42;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        h2 {
            color: #4ec9b0;
            margin-top: 0;
        }
        .key {
            color: #9cdcfe;
            font-weight: bold;
        }
        .value {
            color: #ce9178;
        }
        .success {
            color: #4ec9b0;
        }
        .error {
            color: #f48771;
        }
        .warning {
            color: #dcdcaa;
        }
        pre {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            border: 1px solid #3e3e42;
        }
        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
            font-size: 14px;
        }
        button:hover {
            background: #1177bb;
        }
        .test-result {
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
            background: #1e1e1e;
        }
        input {
            background: #3c3c3c;
            border: 1px solid #3e3e42;
            color: #d4d4d4;
            padding: 8px;
            border-radius: 4px;
            width: 300px;
            margin: 5px;
        }
    </style>
</head>
<body>
    <h1>🔍 Диагностика окружения TradeFrame Builder</h1>

    <div class="section">
        <h2>⚙️ Настройки API</h2>
        <div>
            <label class="key">API URL:</label><br>
            <input type="text" id="api-url" value="https://pos.autooplata.ru/tms">
        </div>
        <div>
            <label class="key">Username:</label><br>
            <input type="text" id="username" value="UserApi">
        </div>
        <div>
            <label class="key">Password:</label><br>
            <input type="password" id="password" value="lHQfLZHzB3tnYour">
        </div>
    </div>

    <div class="section">
        <h2>💾 localStorage</h2>
        <div id="localstorage"></div>
    </div>

    <div class="section">
        <h2>🧪 Тест API авторизации</h2>
        <button onclick="testBasicAuth()">Тест Basic Auth (текущий метод)</button>
        <button onclick="testJsonAuth()">Тест JSON Auth (как в stsApi.ts)</button>
        <div id="auth-test-result"></div>
    </div>

    <div class="section">
        <h2>🌐 Тест запроса к /v1/report/receipts</h2>
        <button onclick="testReceiptsEndpoint()">Выполнить запрос</button>
        <div id="receipts-test-result"></div>
    </div>

    <script>
        // Получаем значения из полей
        function getCredentials() {
            return {
                url: document.getElementById('api-url').value,
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };
        }

        // Проверка localStorage
        function checkLocalStorage() {
            const container = document.getElementById('localstorage');
            const stsConfig = localStorage.getItem('sts-api-config');

            let html = '<div>';

            if (stsConfig) {
                try {
                    const config = JSON.parse(stsConfig);
                    html += '<span class="success">✓ sts-api-config найден</span>';
                    html += '<pre>' + JSON.stringify({
                        url: config.url,
                        username: config.username,
                        password: config.password ? '***' + config.password.slice(-4) : 'нет',
                        enabled: config.enabled,
                        hasToken: !!config.token,
                        tokenExpiry: config.tokenExpiry ? new Date(config.tokenExpiry).toLocaleString() : 'нет'
                    }, null, 2) + '</pre>';
                } catch (e) {
                    html += '<span class="error">✗ Ошибка парсинга sts-api-config</span>';
                }
            } else {
                html += '<span class="warning">⚠ sts-api-config не найден в localStorage</span>';
            }

            // Все ключи localStorage
            html += '<br><details><summary>Все ключи localStorage:</summary>';
            html += '<pre>' + Object.keys(localStorage).join('\n') + '</pre>';
            html += '</details>';

            html += '</div>';
            container.innerHTML = html;
        }

        // Тест Basic Auth
        async function testBasicAuth() {
            const result = document.getElementById('auth-test-result');
            result.innerHTML = '<div class="test-result">⏳ Тестирование Basic Auth...</div>';

            const creds = getCredentials();

            if (!creds.username || !creds.password) {
                result.innerHTML = '<div class="test-result error">❌ Credentials не настроены</div>';
                return;
            }

            const basicAuth = btoa(`${creds.username}:${creds.password}`);

            try {
                const response = await fetch(`${creds.url}/v1/login`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Basic ${basicAuth}`,
                        'Content-Type': 'application/json',
                    },
                });

                const text = await response.text();
                const token = text.replace(/"/g, '');

                if (response.ok) {
                    // Декодируем JWT токен
                    let jwtPayload = 'Не удалось декодировать';
                    try {
                        const parts = token.split('.');
                        if (parts.length === 3) {
                            jwtPayload = JSON.parse(atob(parts[1]));
                        }
                    } catch (e) {}

                    result.innerHTML = `
                        <div class="test-result success">
                            ✅ Basic Auth: <strong>УСПЕШНО</strong><br>
                            Status: ${response.status}<br>
                            Token: ${token.substring(0, 30)}...<br>
                            Token length: ${token.length}<br>
                            <details><summary>JWT Payload:</summary><pre>${JSON.stringify(jwtPayload, null, 2)}</pre></details>
                        </div>
                    `;
                } else {
                    result.innerHTML = `
                        <div class="test-result error">
                            ❌ Basic Auth: <strong>ОШИБКА</strong><br>
                            Status: ${response.status}<br>
                            Response: ${text}
                        </div>
                    `;
                }
            } catch (error) {
                result.innerHTML = `
                    <div class="test-result error">
                        ❌ Basic Auth: <strong>ИСКЛЮЧЕНИЕ</strong><br>
                        Error: ${error.message}
                    </div>
                `;
            }
        }

        // Тест JSON Auth
        async function testJsonAuth() {
            const result = document.getElementById('auth-test-result');
            result.innerHTML = '<div class="test-result">⏳ Тестирование JSON Auth...</div>';

            const creds = getCredentials();

            if (!creds.username || !creds.password) {
                result.innerHTML = '<div class="test-result error">❌ Credentials не настроены</div>';
                return;
            }

            try {
                const response = await fetch(`${creds.url}/v1/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        username: creds.username,
                        password: creds.password
                    })
                });

                const text = await response.text();
                const token = text.replace(/"/g, '');

                if (response.ok) {
                    // Декодируем JWT токен
                    let jwtPayload = 'Не удалось декодировать';
                    try {
                        const parts = token.split('.');
                        if (parts.length === 3) {
                            jwtPayload = JSON.parse(atob(parts[1]));
                        }
                    } catch (e) {}

                    result.innerHTML = `
                        <div class="test-result success">
                            ✅ JSON Auth: <strong>УСПЕШНО</strong><br>
                            Status: ${response.status}<br>
                            Token: ${token.substring(0, 30)}...<br>
                            Token length: ${token.length}<br>
                            <details><summary>JWT Payload:</summary><pre>${JSON.stringify(jwtPayload, null, 2)}</pre></details>
                        </div>
                    `;
                } else {
                    result.innerHTML = `
                        <div class="test-result error">
                            ❌ JSON Auth: <strong>ОШИБКА</strong><br>
                            Status: ${response.status}<br>
                            Response: ${text}
                        </div>
                    `;
                }
            } catch (error) {
                result.innerHTML = `
                    <div class="test-result error">
                        ❌ JSON Auth: <strong>ИСКЛЮЧЕНИЕ</strong><br>
                        Error: ${error.message}
                    </div>
                `;
            }
        }

        // Тест запроса к /v1/report/receipts
        async function testReceiptsEndpoint() {
            const result = document.getElementById('receipts-test-result');
            result.innerHTML = '<div class="test-result">⏳ Получение токена...</div>';

            const creds = getCredentials();

            if (!creds.username || !creds.password) {
                result.innerHTML = '<div class="test-result error">❌ Credentials не настроены</div>';
                return;
            }

            try {
                // Получаем токен через Basic Auth
                const basicAuth = btoa(`${creds.username}:${creds.password}`);
                const authResponse = await fetch(`${creds.url}/v1/login`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Basic ${basicAuth}`,
                        'Content-Type': 'application/json',
                    },
                });

                if (!authResponse.ok) {
                    result.innerHTML = `<div class="test-result error">❌ Ошибка авторизации: ${authResponse.status}</div>`;
                    return;
                }

                const tokenText = await authResponse.text();
                const token = tokenText.replace(/"/g, '');

                result.innerHTML = '<div class="test-result">⏳ Запрос к /v1/report/receipts...</div>';

                // Запрос к receipts
                const receiptsUrl = `${creds.url}/v1/report/receipts?system=15`;
                const receiptsResponse = await fetch(receiptsUrl, {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                    },
                });

                const receiptsText = await receiptsResponse.text();
                let data;
                try {
                    data = JSON.parse(receiptsText);
                } catch (e) {
                    data = receiptsText;
                }

                if (receiptsResponse.ok) {
                    const preview = JSON.stringify(data, null, 2);
                    result.innerHTML = `
                        <div class="test-result success">
                            ✅ Запрос успешен!<br>
                            Status: ${receiptsResponse.status}<br>
                            URL: ${receiptsUrl}<br>
                            <details><summary>Data (${Array.isArray(data) ? data.length + ' записей' : 'объект'}):</summary>
                            <pre>${preview.substring(0, 2000)}${preview.length > 2000 ? '...' : ''}</pre>
                            </details>
                        </div>
                    `;
                } else {
                    result.innerHTML = `
                        <div class="test-result error">
                            ❌ Ошибка запроса<br>
                            Status: ${receiptsResponse.status}<br>
                            URL: ${receiptsUrl}<br>
                            <details><summary>Response:</summary><pre>${JSON.stringify(data, null, 2)}</pre></details>
                        </div>
                    `;
                }
            } catch (error) {
                result.innerHTML = `
                    <div class="test-result error">
                        ❌ Исключение: ${error.message}<br>
                        Stack: <pre>${error.stack}</pre>
                    </div>
                `;
            }
        }

        // Запускаем проверки при загрузке
        window.addEventListener('DOMContentLoaded', () => {
            checkLocalStorage();
        });
    </script>
</body>
</html>
