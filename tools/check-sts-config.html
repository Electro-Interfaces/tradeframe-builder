<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Проверка конфигурации STS API</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #1e293b;
            color: #e2e8f0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #0f172a;
            padding: 20px;
            border-radius: 8px;
        }
        h1 { color: #60a5fa; }
        pre {
            background: #334155;
            padding: 15px;
            border-radius: 4px;
            overflow-x: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }
        .status {
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
        .success { background: #166534; color: #86efac; }
        .error { background: #991b1b; color: #fca5a5; }
        .warning { background: #ca8a04; color: #fef08a; }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Проверка конфигурации STS API</h1>

        <div id="result"></div>

        <button onclick="checkConfig()">Проверить конфигурацию</button>
        <button onclick="enableAPI()">Включить STS API</button>
        <button onclick="disableAPI()">Отключить STS API</button>
        <button onclick="location.reload()">Обновить</button>
    </div>

    <script>
        function checkConfig() {
            const resultDiv = document.getElementById('result');

            try {
                // Читаем конфигурацию из localStorage
                const configStr = localStorage.getItem('sts-api-config');

                if (!configStr) {
                    resultDiv.innerHTML = `
                        <div class="status error">
                            ❌ Конфигурация STS API НЕ НАЙДЕНА в localStorage
                        </div>
                        <p>Ключ 'sts-api-config' отсутствует в localStorage</p>
                    `;
                    return;
                }

                // Парсим JSON
                const config = JSON.parse(configStr);

                // Анализируем конфигурацию
                const checks = {
                    hasConfig: !!config,
                    enabled: config?.enabled === true,
                    hasUrl: !!config?.url,
                    hasUsername: !!config?.username,
                    hasPassword: !!config?.password,
                    hasToken: !!config?.token,
                    tokenExpired: config?.tokenExpiry ? config.tokenExpiry < Date.now() : true
                };

                const isConfigured = checks.hasConfig && checks.enabled && checks.hasUrl && checks.hasUsername && checks.hasPassword;

                resultDiv.innerHTML = `
                    <div class="status ${isConfigured ? 'success' : 'error'}">
                        ${isConfigured ? '✅ STS API настроен корректно' : '❌ STS API НЕ настроен или отключен'}
                    </div>

                    <h3>Проверки конфигурации:</h3>
                    <ul>
                        <li>${checks.hasConfig ? '✅' : '❌'} Конфигурация существует</li>
                        <li>${checks.enabled ? '✅' : '❌'} API включен (enabled = ${config?.enabled})</li>
                        <li>${checks.hasUrl ? '✅' : '❌'} URL указан: ${config?.url || 'НЕТ'}</li>
                        <li>${checks.hasUsername ? '✅' : '❌'} Username указан: ${config?.username ? 'ДА' : 'НЕТ'}</li>
                        <li>${checks.hasPassword ? '✅' : '❌'} Password указан: ${config?.password ? 'ДА' : 'НЕТ'}</li>
                        <li>${checks.hasToken ? '✅' : '⚠️'} Токен: ${checks.hasToken ? 'ЕСТЬ' : 'НЕТ'}</li>
                        <li>${!checks.tokenExpired ? '✅' : '⚠️'} Токен действителен: ${!checks.tokenExpired ? 'ДА' : 'НЕТ (истек или отсутствует)'}</li>
                    </ul>

                    <h3>Полная конфигурация:</h3>
                    <pre>${JSON.stringify(config, null, 2)}</pre>

                    <h3>isConfigured() вернет:</h3>
                    <div class="status ${isConfigured ? 'success' : 'error'}">
                        ${isConfigured ? 'true - API будет работать' : 'false - API не будет работать'}
                    </div>
                `;

            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="status error">
                        ❌ Ошибка парсинга конфигурации
                    </div>
                    <pre>${error.message}</pre>
                `;
            }
        }

        function enableAPI() {
            try {
                const configStr = localStorage.getItem('sts-api-config');
                if (!configStr) {
                    alert('Конфигурация не найдена. Создайте её через настройки приложения.');
                    return;
                }

                const config = JSON.parse(configStr);
                config.enabled = true;
                localStorage.setItem('sts-api-config', JSON.stringify(config));

                alert('✅ STS API включен!');
                checkConfig();
            } catch (error) {
                alert('❌ Ошибка: ' + error.message);
            }
        }

        function disableAPI() {
            try {
                const configStr = localStorage.getItem('sts-api-config');
                if (!configStr) {
                    alert('Конфигурация не найдена.');
                    return;
                }

                const config = JSON.parse(configStr);
                config.enabled = false;
                localStorage.setItem('sts-api-config', JSON.stringify(config));

                alert('❌ STS API отключен!');
                checkConfig();
            } catch (error) {
                alert('❌ Ошибка: ' + error.message);
            }
        }

        // Автоматическая проверка при загрузке
        window.onload = checkConfig;
    </script>
</body>
</html>
