<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест /v1/report/receipts с параметрами</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        .section {
            background: #252526;
            border: 1px solid #3e3e42;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        h2 {
            color: #4ec9b0;
            margin-top: 0;
        }
        .success {
            color: #4ec9b0;
        }
        .error {
            color: #f48771;
        }
        pre {
            background: #1e1e1e;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            border: 1px solid #3e3e42;
            max-height: 400px;
        }
        button {
            background: #0e639c;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            margin: 5px;
            font-size: 14px;
        }
        button:hover {
            background: #1177bb;
        }
        .test-result {
            margin-top: 10px;
            padding: 10px;
            border-radius: 4px;
            background: #1e1e1e;
        }
        input, select {
            background: #3c3c3c;
            border: 1px solid #3e3e42;
            color: #d4d4d4;
            padding: 8px;
            border-radius: 4px;
            margin: 5px;
        }
        label {
            display: inline-block;
            width: 150px;
            color: #9cdcfe;
        }
    </style>
</head>
<body>
    <h1>🧪 Тест /v1/report/receipts</h1>

    <div class="section">
        <h2>⚙️ Параметры запроса</h2>

        <div>
            <label>System (обязательно):</label>
            <input type="number" id="system" value="15" style="width: 100px;">
        </div>

        <div>
            <label>Station:</label>
            <input type="number" id="station" value="4" style="width: 100px;">
            <small style="color: #888;">(может быть обязательным)</small>
        </div>

        <div>
            <label>Date From:</label>
            <input type="date" id="dt_beg" value="">
            <input type="time" id="time_beg" value="00:00">
        </div>

        <div>
            <label>Date To:</label>
            <input type="date" id="dt_end" value="">
            <input type="time" id="time_end" value="23:59">
        </div>

        <div>
            <label>Shift:</label>
            <input type="number" id="shift" value="" placeholder="опционально" style="width: 100px;">
        </div>
    </div>

    <div class="section">
        <h2>🚀 Тесты</h2>
        <button onclick="testMinimalParams()">1. Только system</button>
        <button onclick="testWithStation()">2. system + station</button>
        <button onclick="testWithDates()">3. system + dates</button>
        <button onclick="testFullParams()">4. Все параметры</button>
        <button onclick="testSwaggerExample()">5. Пример из Swagger</button>
    </div>

    <div class="section">
        <h2>📊 Результат</h2>
        <div id="result"></div>
    </div>

    <script>
        // Устанавливаем даты по умолчанию (последние 7 дней)
        window.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            const weekAgo = new Date(today.getTime() - 7 * 24 * 60 * 60 * 1000);

            document.getElementById('dt_end').value = today.toISOString().split('T')[0];
            document.getElementById('dt_beg').value = weekAgo.toISOString().split('T')[0];
        });

        async function getToken() {
            const url = 'https://pos.autooplata.ru/tms';
            const username = 'UserApi';
            const password = 'lHQfLZHzB3tnYour';

            const basicAuth = btoa(`${username}:${password}`);
            const response = await fetch(`${url}/v1/login`, {
                method: 'POST',
                headers: {
                    'Authorization': `Basic ${basicAuth}`,
                    'Content-Type': 'application/json',
                },
            });

            if (!response.ok) {
                throw new Error(`Auth failed: ${response.status}`);
            }

            const token = await response.text();
            return token.replace(/"/g, '');
        }

        async function makeRequest(params) {
            const result = document.getElementById('result');
            result.innerHTML = '<div class="test-result">⏳ Получение токена...</div>';

            try {
                const token = await getToken();

                // Формируем URL с параметрами
                const url = new URL('https://pos.autooplata.ru/tms/v1/report/receipts');

                Object.entries(params).forEach(([key, value]) => {
                    if (value !== null && value !== undefined && value !== '') {
                        url.searchParams.append(key, value);
                    }
                });

                result.innerHTML = `<div class="test-result">⏳ Запрос к API...<br>URL: ${url.toString()}</div>`;

                const response = await fetch(url.toString(), {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json',
                    },
                });

                const text = await response.text();
                let data;
                try {
                    data = JSON.parse(text);
                } catch (e) {
                    data = text;
                }

                if (response.ok) {
                    const preview = JSON.stringify(data, null, 2);
                    const recordCount = Array.isArray(data)
                        ? data.length
                        : (data.length !== undefined ? data.length : 'объект');

                    result.innerHTML = `
                        <div class="test-result success">
                            ✅ <strong>УСПЕХ!</strong><br><br>
                            <strong>Status:</strong> ${response.status}<br>
                            <strong>URL:</strong> ${url.toString()}<br>
                            <strong>Записей:</strong> ${recordCount}<br><br>
                            <details open><summary><strong>Response Data:</strong></summary>
                            <pre>${preview}</pre>
                            </details>
                        </div>
                    `;
                } else {
                    result.innerHTML = `
                        <div class="test-result error">
                            ❌ <strong>ОШИБКА ${response.status}</strong><br><br>
                            <strong>URL:</strong> ${url.toString()}<br><br>
                            <details open><summary><strong>Response:</strong></summary>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                            </details>
                        </div>
                    `;
                }
            } catch (error) {
                result.innerHTML = `
                    <div class="test-result error">
                        ❌ <strong>ИСКЛЮЧЕНИЕ</strong><br><br>
                        ${error.message}<br><br>
                        <pre>${error.stack}</pre>
                    </div>
                `;
            }
        }

        // Тест 1: Только system
        function testMinimalParams() {
            makeRequest({
                system: document.getElementById('system').value
            });
        }

        // Тест 2: system + station
        function testWithStation() {
            makeRequest({
                system: document.getElementById('system').value,
                station: document.getElementById('station').value
            });
        }

        // Тест 3: system + dates
        function testWithDates() {
            const dtBeg = document.getElementById('dt_beg').value;
            const timeBeg = document.getElementById('time_beg').value;
            const dtEnd = document.getElementById('dt_end').value;
            const timeEnd = document.getElementById('time_end').value;

            makeRequest({
                system: document.getElementById('system').value,
                dt_beg: `${dtBeg}T${timeBeg}:00`,
                dt_end: `${dtEnd}T${timeEnd}:59`
            });
        }

        // Тест 4: Все параметры
        function testFullParams() {
            const dtBeg = document.getElementById('dt_beg').value;
            const timeBeg = document.getElementById('time_beg').value;
            const dtEnd = document.getElementById('dt_end').value;
            const timeEnd = document.getElementById('time_end').value;
            const shift = document.getElementById('shift').value;

            const params = {
                system: document.getElementById('system').value,
                station: document.getElementById('station').value,
                dt_beg: `${dtBeg}T${timeBeg}:00`,
                dt_end: `${dtEnd}T${timeEnd}:59`
            };

            if (shift) {
                params.shift = shift;
            }

            makeRequest(params);
        }

        // Тест 5: Пример из Swagger (если работает на проде)
        function testSwaggerExample() {
            // Используем параметры, которые точно работают на проде
            const today = new Date();
            const monthAgo = new Date(today.getTime() - 30 * 24 * 60 * 60 * 1000);

            makeRequest({
                system: 15,
                station: 4,
                dt_beg: monthAgo.toISOString().split('.')[0],
                dt_end: today.toISOString().split('.')[0]
            });
        }
    </script>
</body>
</html>
