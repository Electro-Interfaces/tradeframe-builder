<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Проверка sessionStorage</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
            background: #1e293b;
            color: #e2e8f0;
        }
        h1 { color: #60a5fa; }
        .section {
            background: #334155;
            padding: 20px;
            margin: 20px 0;
            border-radius: 8px;
            border: 1px solid #475569;
        }
        pre {
            background: #0f172a;
            padding: 15px;
            border-radius: 6px;
            overflow-x: auto;
            line-height: 1.6;
        }
        .key {
            color: #10b981;
            font-weight: 600;
        }
        .value {
            color: #60a5fa;
        }
        .error {
            color: #ef4444;
        }
        .success {
            color: #10b981;
        }
    </style>
</head>
<body>
    <h1>🔐 Проверка sessionStorage</h1>

    <div class="section">
        <h2>Содержимое sessionStorage:</h2>
        <div id="storage-data"></div>
    </div>

    <div class="section">
        <h2>Декодированный JWT токен (если есть):</h2>
        <div id="token-data"></div>
    </div>

    <script>
        // Показываем все ключи в sessionStorage
        const storageDiv = document.getElementById('storage-data');
        let html = '<pre>';

        if (sessionStorage.length === 0) {
            html += '<span class="error">sessionStorage пуст!</span>';
        } else {
            for (let i = 0; i < sessionStorage.length; i++) {
                const key = sessionStorage.key(i);
                const value = sessionStorage.getItem(key);

                html += `<span class="key">${key}:</span>\n`;

                try {
                    // Пробуем распарсить как JSON
                    const parsed = JSON.parse(value);
                    html += `<span class="value">${JSON.stringify(parsed, null, 2)}</span>\n\n`;
                } catch (e) {
                    // Если не JSON, показываем как есть (но обрезаем длинные строки)
                    const displayValue = value.length > 200 ? value.substring(0, 200) + '...' : value;
                    html += `<span class="value">${displayValue}</span>\n\n`;
                }
            }
        }

        html += '</pre>';
        storageDiv.innerHTML = html;

        // Декодируем JWT токен
        const tokenDiv = document.getElementById('token-data');
        const token = sessionStorage.getItem('authToken') || sessionStorage.getItem('token') || sessionStorage.getItem('jwt');

        if (token) {
            try {
                // JWT состоит из трех частей, разделенных точками
                const parts = token.split('.');
                if (parts.length === 3) {
                    // Декодируем payload (вторая часть)
                    const payload = JSON.parse(atob(parts[1]));
                    tokenDiv.innerHTML = '<pre class="success">' + JSON.stringify(payload, null, 2) + '</pre>';
                } else {
                    tokenDiv.innerHTML = '<pre class="error">Токен найден, но формат неверный</pre>';
                }
            } catch (e) {
                tokenDiv.innerHTML = '<pre class="error">Ошибка декодирования токена: ' + e.message + '</pre>';
            }
        } else {
            tokenDiv.innerHTML = '<pre class="error">JWT токен не найден в sessionStorage</pre>';
        }
    </script>
</body>
</html>
