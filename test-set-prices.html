<!DOCTYPE html>
<html>
<head>
    <title>Тест установки цен через STS API</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; border-radius: 5px; }
        .error { background: #ffebee; }
        .success { background: #e8f5e9; }
        button { padding: 10px 20px; margin: 5px; font-size: 16px; }
        .price-input { margin: 5px 0; }
        .price-input input { margin: 0 10px; padding: 5px; }
    </style>
</head>
<body>
    <h1>Тест функциональности установки цен</h1>

    <div>
        <h3>Параметры для теста:</h3>
        <p><strong>Сеть (system):</strong> 15</p>
        <p><strong>Торговая точка (station):</strong> 4</p>
        <p><strong>URL:</strong> https://pos.autooplata.ru/tms/v1/prices</p>
    </div>

    <div>
        <h3>Цены для установки:</h3>
        <div class="price-input">
            <label>АИ-92: <input type="number" id="ai92" value="45.50" step="0.01"> ₽</label>
        </div>
        <div class="price-input">
            <label>АИ-95: <input type="number" id="ai95" value="48.20" step="0.01"> ₽</label>
        </div>
        <div class="price-input">
            <label>ДТ: <input type="number" id="dt" value="52.10" step="0.01"> ₽</label>
        </div>
        <div class="price-input">
            <label>Дата вступления: <input type="datetime-local" id="effective_date"></label>
        </div>
    </div>

    <button onclick="testSetPrices()">Тестировать POST /v1/prices</button>
    <button onclick="clearLogs()">Очистить логи</button>
    <button onclick="openPricesPage()">Открыть страницу цен</button>

    <div id="logs"></div>

    <script>
        // Устанавливаем дату по умолчанию на текущее время + 5 минут
        const now = new Date();
        now.setMinutes(now.getMinutes() + 5);
        document.getElementById('effective_date').value = now.toISOString().slice(0, 16);

        function log(message, type = 'log') {
            const logs = document.getElementById('logs');
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.innerHTML = `<strong>${new Date().toLocaleTimeString()}:</strong> ${message}`;
            logs.appendChild(div);
            console.log(message);
        }

        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
        }

        function openPricesPage() {
            window.open('http://localhost:3002/point/prices', '_blank');
        }

        async function testSetPrices() {
            log('🧪 Начинаем тест установки цен через STS API...');

            // Собираем данные из формы
            const prices = [
                { fuel_type: 'АИ-92', price: parseFloat(document.getElementById('ai92').value) },
                { fuel_type: 'АИ-95', price: parseFloat(document.getElementById('ai95').value) },
                { fuel_type: 'ДТ', price: parseFloat(document.getElementById('dt').value) }
            ];

            const effectiveDate = new Date(document.getElementById('effective_date').value).toISOString();

            log(`📋 Данные для отправки:`, 'log');
            log(`   - Цены: ${JSON.stringify(prices, null, 2)}`, 'log');
            log(`   - Дата вступления: ${effectiveDate}`, 'log');

            // Имитируем запрос к API
            const apiUrl = 'https://pos.autooplata.ru/tms/v1/prices?system=15&station=4';
            const requestBody = {
                prices: prices,
                effective_date: effectiveDate
            };

            log(`🌐 URL запроса: ${apiUrl}`, 'log');
            log(`📦 Тело запроса: ${JSON.stringify(requestBody, null, 2)}`, 'log');

            try {
                // В реальном тестировании нужно использовать настоящие учетные данные
                log('⚠️ Примечание: Для реального тестирования используйте приложение TradeControl', 'log');
                log('   1. Откройте страницу цен в приложении', 'log');
                log('   2. Нажмите кнопку "Изменить цены" (оранжевая кнопка)', 'log');
                log('   3. Настройте цены и дату вступления в силу', 'log');
                log('   4. Нажмите "Установить цены"', 'log');

                log('✅ Структура запроса корректна для STS API', 'success');
                log('📝 Требования API соблюдены:', 'success');
                log('   ✓ Параметры system и station в URL', 'success');
                log('   ✓ Массив prices в теле запроса', 'success');
                log('   ✓ Поле effective_date в ISO формате', 'success');
                log('   ✓ Bearer токен будет добавлен автоматически', 'success');

            } catch (error) {
                log(`❌ Ошибка при тестировании: ${error.message}`, 'error');
            }
        }

        // Автоматически запускаем информационный лог при загрузке
        window.onload = () => {
            log('🚀 Страница тестирования функции установки цен загружена');
            log('📌 Для полного тестирования используйте приложение TradeControl');
        };
    </script>
</body>
</html>
