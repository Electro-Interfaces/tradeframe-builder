<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тест сохранения порогов купюроприемника</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        .container {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
        }
        h1 {
            color: #60a5fa;
        }
        .section {
            margin: 20px 0;
            padding: 15px;
            background: #333;
            border-radius: 5px;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover {
            background: #2563eb;
        }
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        input {
            padding: 8px;
            margin: 5px;
            border-radius: 4px;
            border: 1px solid #555;
            background: #444;
            color: white;
            width: 120px;
        }
        .result {
            background: #1e293b;
            padding: 10px;
            border-radius: 5px;
            margin-top: 10px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
        }
        .success { color: #4ade80; }
        .error { color: #f87171; }
        label {
            display: inline-block;
            width: 200px;
            color: #94a3b8;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧪 Тест сохранения порогов купюроприемника</h1>

        <div class="section">
            <h3>Параметры подключения</h3>
            <div>
                <label>Supabase URL:</label>
                <input type="text" id="supabaseUrl" value="https://ynwbmxvqucmvjhmsxtqh.supabase.co" style="width: 300px;">
            </div>
            <div>
                <label>Supabase Anon Key:</label>
                <input type="text" id="supabaseKey" value="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inlud2JteHZxdWNtdmpobXN4dHFoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjYwNjE3MTAsImV4cCI6MjA0MTYzNzcxMH0.3x7q8pKXJlwJ3S0rMZdBhUq6EqZCpMWPvukUE_0EVSI" style="width: 500px;">
            </div>
        </div>

        <div class="section">
            <h3>Торговая точка</h3>
            <div>
                <label>ID точки:</label>
                <input type="text" id="pointId" value="bto-azs-4" placeholder="bto-azs-4">
            </div>
        </div>

        <div class="section">
            <h3>Пороговые значения</h3>
            <div>
                <label>Купюр ⚠️ (предупреждение):</label>
                <input type="number" id="billCountWarning" value="320">
            </div>
            <div>
                <label>Купюр 🔴 (критично):</label>
                <input type="number" id="billCountCritical" value="350">
            </div>
            <div>
                <label>Сумма ⚠️ (предупреждение):</label>
                <input type="number" id="cashAmountWarning" value="200000">
            </div>
            <div>
                <label>Сумма 🔴 (критично):</label>
                <input type="number" id="cashAmountCritical" value="300000">
            </div>
        </div>

        <div class="section">
            <button onclick="testRead()">1️⃣ Прочитать текущие значения</button>
            <button onclick="testSave()">2️⃣ Сохранить новые значения</button>
            <button onclick="testReadAfterSave()">3️⃣ Проверить сохранение</button>
            <button onclick="clearResults()">Очистить результаты</button>
        </div>

        <div class="section">
            <h3>Результаты</h3>
            <div id="results" class="result">Здесь будут отображаться результаты тестов...</div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        let supabase;

        function log(message, type = 'info') {
            const results = document.getElementById('results');
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'success' ? 'success' : type === 'error' ? 'error' : '';
            results.innerHTML += `<span class="${color}">[${timestamp}] ${message}</span>\n`;
            results.scrollTop = results.scrollHeight;
        }

        function initSupabase() {
            const url = document.getElementById('supabaseUrl').value;
            const key = document.getElementById('supabaseKey').value;
            supabase = createClient(url, key);
            log('✅ Supabase клиент инициализирован', 'success');
        }

        function parseStationId(id) {
            const parts = id.split('-azs-');
            if (parts.length !== 2) return null;
            return {
                networkCode: parts[0],
                stationCode: parts[1]
            };
        }

        window.testRead = async function() {
            try {
                log('🔍 Начинаем чтение текущих значений...');
                initSupabase();

                const pointId = document.getElementById('pointId').value;
                log(`📍 ID точки: ${pointId}`);

                const parsed = parseStationId(pointId);
                if (!parsed) {
                    throw new Error(`Неверный формат ID: ${pointId}`);
                }

                log(`🏢 Сеть: ${parsed.networkCode}, Станция: ${parsed.stationCode}`);

                // Читаем tenant
                const { data: tenant, error } = await supabase
                    .from('tenants')
                    .select('*')
                    .eq('code', parsed.networkCode)
                    .eq('type', 'network')
                    .single();

                if (error) {
                    throw new Error(`Ошибка Supabase: ${error.message}`);
                }

                if (!tenant) {
                    throw new Error(`Сеть ${parsed.networkCode} не найдена`);
                }

                log(`✅ Найдена сеть: ${tenant.name}`, 'success');

                // Ищем станцию
                const stations = tenant.settings?.stations || [];
                const station = stations.find(s => s.code === parsed.stationCode);

                if (!station) {
                    throw new Error(`Станция ${parsed.stationCode} не найдена`);
                }

                log(`✅ Найдена станция: ${station.name}`, 'success');

                // Показываем текущие пороги
                const thresholds = station.billAcceptorThresholds;
                if (thresholds) {
                    log('📊 Текущие пороговые значения:', 'success');
                    log(JSON.stringify(thresholds, null, 2), 'success');
                } else {
                    log('⚠️ Пороговые значения не установлены');
                }

            } catch (error) {
                log(`❌ Ошибка: ${error.message}`, 'error');
                console.error(error);
            }
        };

        window.testSave = async function() {
            try {
                log('💾 Начинаем сохранение новых значений...');
                initSupabase();

                const pointId = document.getElementById('pointId').value;
                const thresholds = {
                    billCountWarning: parseInt(document.getElementById('billCountWarning').value) || undefined,
                    billCountCritical: parseInt(document.getElementById('billCountCritical').value) || undefined,
                    cashAmountWarning: parseInt(document.getElementById('cashAmountWarning').value) || undefined,
                    cashAmountCritical: parseInt(document.getElementById('cashAmountCritical').value) || undefined,
                };

                log(`📍 ID точки: ${pointId}`);
                log(`📝 Новые значения: ${JSON.stringify(thresholds, null, 2)}`);

                const parsed = parseStationId(pointId);
                if (!parsed) {
                    throw new Error(`Неверный формат ID: ${pointId}`);
                }

                // Находим tenant
                const { data: tenant, error: findError } = await supabase
                    .from('tenants')
                    .select('*')
                    .eq('code', parsed.networkCode)
                    .eq('type', 'network')
                    .single();

                if (findError || !tenant) {
                    throw new Error(`Сеть ${parsed.networkCode} не найдена`);
                }

                log(`✅ Найдена сеть: ${tenant.name}`, 'success');

                // Обновляем станцию
                const stations = tenant.settings?.stations || [];
                const updatedStations = stations.map(station => {
                    if (station.code === parsed.stationCode) {
                        return {
                            ...station,
                            billAcceptorThresholds: thresholds
                        };
                    }
                    return station;
                });

                // Проверяем что станция найдена
                const stationFound = updatedStations.some(s => s.code === parsed.stationCode);
                if (!stationFound) {
                    throw new Error(`Станция ${parsed.stationCode} не найдена`);
                }

                // Сохраняем в базу
                const { error: updateError } = await supabase
                    .from('tenants')
                    .update({
                        settings: {
                            ...tenant.settings,
                            stations: updatedStations
                        },
                        updated_at: new Date().toISOString()
                    })
                    .eq('id', tenant.id);

                if (updateError) {
                    throw new Error(`Ошибка обновления: ${updateError.message}`);
                }

                log('✅ Значения успешно сохранены!', 'success');
                log('💡 Теперь нажмите "3️⃣ Проверить сохранение" для проверки');

            } catch (error) {
                log(`❌ Ошибка: ${error.message}`, 'error');
                console.error(error);
            }
        };

        window.testReadAfterSave = async function() {
            log('🔄 Проверяем сохраненные значения...');
            await testRead();
        };

        window.clearResults = function() {
            document.getElementById('results').innerHTML = 'Результаты очищены. Готов к новым тестам.\n';
        };

        // Автоматически загружаем текущие значения при загрузке страницы
        window.addEventListener('load', () => {
            log('🚀 Страница загружена. Готов к тестированию!');
            log('💡 Нажмите "1️⃣ Прочитать текущие значения" для начала');
        });
    </script>
</body>
</html>
