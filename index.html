    <!-- Специальные фиксы для мобильных браузеров -->
    <script>
      // Детекция мобильного устройства
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      const isGitHubPages = window.location.hostname === 'electro-interfaces.github.io';

      // Специальная обработка для мобильных (на всех доменах!)
      if (isMobile) {
        const APP_VERSION = 'v1.5.30';
        const BUILD_TIMESTAMP = 'BUILD_' + Date.now(); // Уникальный ID сборки
        const CACHE_VERSION_KEY = 'tf_cache_version';
        const LAST_RELOAD_KEY = 'tf_last_force_reload';

        // Безопасная работа с localStorage (Safari Private Mode protection)
        const safeStorage = {
          getItem: function(key) {
            try {
              return localStorage.getItem(key) || sessionStorage.getItem(key);
            } catch(e) {
              try {
                return sessionStorage.getItem(key);
              } catch(e2) {
                return null;
              }
            }
          },
          setItem: function(key, value) {
            try {
              localStorage.setItem(key, value);
            } catch(e) {
              try {
                sessionStorage.setItem(key, value);
              } catch(e2) {
                // Игнорируем если и sessionStorage недоступен
              }
            }
          }
        };

        // Polyfill для AbortSignal.timeout (Safari 14 и ниже)
        // Safari 15.4+ поддерживает нативно, но для старых версий добавляем fallback
        if (typeof AbortSignal.timeout === 'undefined') {
          AbortSignal.timeout = function(ms) {
            const controller = new AbortController();
            setTimeout(() => controller.abort(), ms);
            return controller.signal;
          };
        }

        // Улучшенная детекция Safari и его версии
        const detectSafari = function() {
          const ua = navigator.userAgent;

          // Проверяем что это Safari (не Chrome, не Edge)
          const isSafari = /^((?!chrome|android).)*safari/i.test(ua);

          if (!isSafari) {
            return { isSafari: false, version: null, isIOS: false };
          }

          // Определяем iOS Safari
          const isIOS = /iPhone|iPad|iPod/.test(ua);

          // Извлекаем версию Safari
          let version = null;
          const versionMatch = ua.match(/Version\/(\d+(\.\d+)?)/);
          if (versionMatch) {
            version = parseFloat(versionMatch[1]);
          }

          return { isSafari: true, version, isIOS };
        };

        const safariInfo = detectSafari();

        // Применяем специфичные для Safari фиксы
        if (safariInfo.isSafari) {
          // Для Safari < 15 добавляем дополнительную защиту
          if (safariInfo.version && safariInfo.version < 15) {
            // Дополнительные legacy фиксы для старых Safari
            console.info('Safari < 15 detected, applying legacy compatibility fixes');
          }

          // Для iOS Safari применяем мобильные оптимизации
          if (safariInfo.isIOS) {
            // iOS-specific improvements
            document.documentElement.style.setProperty('-webkit-tap-highlight-color', 'transparent');
          }
        }

        // Принудительная очистка кеша при каждой загрузке если прошло > 1 минуты
        const lastReload = safeStorage.getItem(LAST_RELOAD_KEY);
        const now = Date.now();

        if (!lastReload || (now - parseInt(lastReload)) > 60000) {
          // Прошло больше минуты - очищаем кеш
          safeStorage.setItem(LAST_RELOAD_KEY, now.toString());
          safeStorage.setItem(CACHE_VERSION_KEY, APP_VERSION);

          if ('caches' in window) {
            caches.keys().then(cacheNames => {
              return Promise.all(
                cacheNames.map(cacheName => caches.delete(cacheName))
              );
            });
          }
        }

        // Умная очистка кэша - при изменении версии
        if ('caches' in window) {
          const savedVersion = safeStorage.getItem(CACHE_VERSION_KEY);
          if (savedVersion !== APP_VERSION) {
            // Версия изменилась - очищаем старый кэш и перезагружаем
            caches.keys().then(cacheNames => {
              return Promise.all(
                cacheNames.map(cacheName => caches.delete(cacheName))
              );
            }).then(() => {
              safeStorage.setItem(CACHE_VERSION_KEY, APP_VERSION);
              safeStorage.setItem(LAST_RELOAD_KEY, now.toString());
              // Исправлено: reload(true) устарел в Safari
              window.location.reload();
            });
          }
        }

        // Увеличенные timeout'ы для API запросов на медленных соединениях
        if ('fetch' in window) {
          const originalFetch = window.fetch;
          window.fetch = function(input, init) {
            init = init || {};
            // Разрешаем кэширование, но с ограниченным временем
            init.cache = init.cache || 'default';

            // Увеличенный timeout для мобильных - 30 секунд
            if (!init.signal) {
              const controller = new AbortController();
              init.signal = controller.signal;
              setTimeout(() => controller.abort(), 30000);
            }

            return originalFetch(input, init);
          };
        }
      }

      // Регистрация Service Worker для PWA с динамическим BASE_URL
      const isLocalhost = ['localhost', '127.0.0.1'].includes(location.hostname);
      if ('serviceWorker' in navigator && (location.protocol === 'https:' || isLocalhost)) {
        window.addEventListener('load', function() {
          // Получаем базовый путь из различных источников
          let basePath = '/';

          // 1. Проверяем Vite BASE_URL (если доступен)
          if (typeof __BASE__ !== 'undefined') {
            basePath = __BASE__;
          }
          // 2. Проверяем <base> тег
          else {
            const baseTag = document.querySelector('base');
            if (baseTag) {
              basePath = baseTag.getAttribute('href') || '/';
            }
            // 3. Определяем по текущему пути для GitHub Pages
            else if (location.pathname.includes('/tradeframe-builder/')) {
              basePath = '/tradeframe-builder/';
            }
          }

          // Нормализуем путь
          const normalizedBase = basePath.endsWith('/') ? basePath : basePath + '/';

          navigator.serviceWorker.register(`${normalizedBase}sw.js`, {
            scope: normalizedBase
          }).then(function(registration) {
          }).catch(function(error) {
          });
        });
      }
    </script>

        <!-- App Name -->
        <h1 style="
          font-size: 28px;
          font-weight: 700;
          margin: 0 0 8px 0;
          letter-spacing: -0.5px;
        ">TradeFrame</h1>

        <!-- Version -->
        <p style="
          font-size: 14px;
          color: #94a3b8;
          margin: 0 0 32px 0;
        ">v1.5.30</p>

        <!-- Loading Animation -->
        <div style="
          width: 40px;
          height: 40px;
          border: 3px solid #1e293b;
          border-top: 3px solid #3b82f6;
          border-radius: 50%;
          animation: spin 1s linear infinite;
        "></div>

        <!-- Loading Text -->
        <p id="loading-text" style="
          margin-top: 16px;
          font-size: 14px;
          color: #64748b;
        ">Загрузка приложения...</p>
      </div>

      <style>
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>

      <script>
        // Функция обновления статуса загрузки
        window.updateLoadingStatus = function(status) {
          const loadingText = document.getElementById('loading-text');
          if (loadingText) {
            loadingText.textContent = status;
          }
        };

        // Удаляем loading индикатор когда React готов
        let loadingRemoved = false; // Защита от повторных вызовов
        function removeLoadingIndicator() {
          if (loadingRemoved) {
            return;
          }

          const loading = document.getElementById('initial-loading');
          if (loading) {
            loadingRemoved = true; // Блокируем повторные вызовы
            loading.style.opacity = '0';
            loading.style.transition = 'opacity 0.3s ease-out';
            setTimeout(() => {
              loading.remove();
            }, 300);
          }
        }

        // Глобальная функция для принудительного удаления
        window.removeInitialLoading = removeLoadingIndicator;

        // Автоматическое удаление через 5 секунд как fallback
        setTimeout(() => {
          removeLoadingIndicator();
        }, 5000);

        // Удаляем когда React полностью загружен
        document.addEventListener('DOMContentLoaded', function() {
          // Проверяем каждые 100мс готов ли React (быстрее для лучшего UX)
          const checkReact = setInterval(() => {
            const rootEl = document.querySelector('#root');
            const hasReactContent = rootEl && (
              // ПРИОРИТЕТ: флаг от main.tsx что React готов
              window.reactReady ||
              // Проверяем наличие React Router (всегда присутствует после загрузки App)
              rootEl.querySelector('[data-testid="router-ready"]') ||
              // Быстрая детекция: есть дочерние элементы (React загрузился)
              rootEl.children.length > 0 ||
              // Ключевые селекторы основных компонентов
              rootEl.querySelector('.login-form') ||
              rootEl.querySelector('main') ||
              rootEl.querySelector('nav') ||
              rootEl.querySelector('form') ||
              // Проверяем минимальное содержимое (но не полагаемся только на это)
              (rootEl.textContent && rootEl.textContent.trim().length > 20)
            );

            if (hasReactContent) {
              clearInterval(checkReact);
              setTimeout(removeLoadingIndicator, 100); // Максимально быстро
            }
          }, 100); // Уменьшен интервал для быстрой детекции

          // Fallback для clearInterval через 6 секунд (быстрее)
          setTimeout(() => {
            clearInterval(checkReact);
          }, 6000);
        });
      </script>
