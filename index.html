    <!-- Специальные фиксы для мобильных браузеров -->
    <script>
      // Детекция мобильного устройства
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

      // Специальная обработка для мобильных
      if (isMobile) {
        // Polyfill для AbortSignal.timeout (Safari 14 и ниже)
        if (typeof AbortSignal !== 'undefined' && typeof AbortSignal.timeout === 'undefined') {
          AbortSignal.timeout = function(ms) {
            const controller = new AbortController();
            setTimeout(() => controller.abort(), ms);
            return controller.signal;
          };
        }

        // Детекция Safari для iOS-specific фиксов
        const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
        const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);

        if (isSafari && isIOS) {
          document.documentElement.style.setProperty('-webkit-tap-highlight-color', 'transparent');
        }

        // Увеличенные timeout'ы для API запросов на медленных соединениях
        if ('fetch' in window) {
          const originalFetch = window.fetch;
          window.fetch = function(input, init) {
            init = init || {};

            // Увеличенный timeout для мобильных - 30 секунд (если не задан)
            if (!init.signal) {
              const controller = new AbortController();
              init.signal = controller.signal;
              setTimeout(() => controller.abort(), 30000);
            }

            return originalFetch(input, init);
          };
        }
      }

      // Service Worker регистрируется в main.tsx для единой точки входа
    </script>

  <body>
    <div id="root">
      <!-- Fallback Loading Indicator -->
      <div id="initial-loading" style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: hsl(var(--background, 210 20% 98%));
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        color: hsl(var(--foreground, 215 25% 15%));
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      ">
        <!-- Logo -->
        <div style="
          width: 80px;
          height: 80px;
          background: #3b82f6;
          border-radius: 20px;
          display: flex;
          align-items: center;
          justify-content: center;
          margin-bottom: 24px;
          box-shadow: 0 10px 25px rgba(59, 130, 246, 0.3);
        ">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
            <polyline points="9,22 9,12 15,12 15,22"/>
          </svg>
        </div>

        <!-- App Name -->
        <h1 style="
          font-size: 28px;
          font-weight: 700;
          margin: 0 0 32px 0;
          letter-spacing: -0.5px;
        ">TradePoint</h1>

        <!-- Loading Animation -->
        <div style="
          width: 40px;
          height: 40px;
          border: 3px solid hsl(var(--border, 214 20% 88%));
          border-top: 3px solid #3b82f6;
          border-radius: 50%;
          animation: spin 1s linear infinite;
        "></div>

        <!-- Loading Text -->
        <p id="loading-text" style="
          margin-top: 16px;
          font-size: 14px;
          color: hsl(var(--muted-foreground, 215 15% 50%));
        ">Загрузка приложения...</p>
      </div>

      <style>
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
      </style>

      <script>
        // Функция обновления статуса загрузки
        window.updateLoadingStatus = function(status) {
          const loadingText = document.getElementById('loading-text');
          if (loadingText) {
            loadingText.textContent = status;
          }
        };

        // Удаляем loading индикатор когда React готов
        let loadingRemoved = false; // Защита от повторных вызовов
        function removeLoadingIndicator() {
          if (loadingRemoved) {
            return;
          }

          const loading = document.getElementById('initial-loading');
          if (loading) {
            loadingRemoved = true; // Блокируем повторные вызовы
            loading.style.opacity = '0';
            loading.style.transition = 'opacity 0.3s ease-out';
            setTimeout(() => {
              loading.remove();
            }, 300);
          }
        }

        // Глобальная функция для принудительного удаления
        window.removeInitialLoading = removeLoadingIndicator;

        // Автоматическое удаление через 5 секунд как fallback
        setTimeout(() => {
          removeLoadingIndicator();
        }, 5000);

        // Удаляем когда React полностью загружен
        document.addEventListener('DOMContentLoaded', function() {
          // Проверяем каждые 100мс готов ли React (быстрее для лучшего UX)
          const checkReact = setInterval(() => {
            const rootEl = document.querySelector('#root');
            const hasReactContent = rootEl && (
              // ПРИОРИТЕТ: флаг от main.tsx что React готов
              window.reactReady ||
              // Проверяем наличие React Router (всегда присутствует после загрузки App)
              rootEl.querySelector('[data-testid="router-ready"]') ||
              // Быстрая детекция: есть дочерние элементы (React загрузился)
              rootEl.children.length > 0 ||
              // Ключевые селекторы основных компонентов
              rootEl.querySelector('.login-form') ||
              rootEl.querySelector('main') ||
              rootEl.querySelector('nav') ||
              rootEl.querySelector('form') ||
              // Проверяем минимальное содержимое (но не полагаемся только на это)
              (rootEl.textContent && rootEl.textContent.trim().length > 20)
            );

            if (hasReactContent) {
              clearInterval(checkReact);
              setTimeout(removeLoadingIndicator, 100); // Максимально быстро
            }
          }, 100); // Уменьшен интервал для быстрой детекции

          // Fallback: если React не загрузился за 6 секунд — показать ошибку
          setTimeout(() => {
            clearInterval(checkReact);
            if (!loadingRemoved) {
              var loadingText = document.getElementById('loading-text');
              if (loadingText) {
                loadingText.textContent = 'Приложение не загрузилось. Попробуйте обновить страницу.';
                loadingText.style.color = '#ef4444';
              }
              // Добавляем кнопку перезагрузки
              var loadingEl = document.getElementById('initial-loading');
              if (loadingEl) {
                var reloadBtn = document.createElement('button');
                reloadBtn.textContent = 'Обновить страницу';
                reloadBtn.style.cssText = 'margin-top: 16px; padding: 10px 24px; background: #3b82f6; color: white; border: none; border-radius: 8px; font-size: 14px; cursor: pointer; font-family: inherit;';
                reloadBtn.onclick = function() { window.location.reload(); };
                loadingEl.appendChild(reloadBtn);
              }
              // Останавливаем анимацию спиннера
              var spinner = loadingEl && loadingEl.querySelector('div[style*="border-radius: 50%"]');
              if (spinner) {
                spinner.style.animation = 'none';
                spinner.style.borderColor = '#ef4444';
                spinner.style.borderTopColor = '#ef4444';
              }
            }
          }, 6000);
        });
      </script>
    </div>
