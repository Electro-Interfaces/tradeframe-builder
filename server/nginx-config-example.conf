# Конфигурация nginx для Backend Proxy
# Добавить в существующий server block для prod.dataworker.ru / testtf.dataworker.ru

# Backend Proxy для всех API endpoints
# ВАЖНО: Этот блок должен проксировать ВСЕ /api/* запросы на Express сервер
location /api/ {
    # Проксирование на локальный Express сервер (порт 3001)
    proxy_pass http://localhost:3001/api/;

    # HTTP/1.1 для keep-alive соединений
    proxy_http_version 1.1;

    # Заголовки для WebSocket (если потребуется в будущем)
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';

    # Передаем оригинальные заголовки
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Отключаем кэширование для динамических данных
    proxy_cache_bypass $http_upgrade;

    # Таймауты (30 секунд для медленных API запросов)
    proxy_connect_timeout 30s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;

    # Буферизация ответов
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;
}

# Health check для мониторинга (опционально, только для внутренней сети)
location /health {
    proxy_pass http://localhost:3001/health;
    proxy_http_version 1.1;

    # Ограничить доступ только для localhost
    allow 127.0.0.1;
    deny all;
}
