name: Deploy to PRODUCTION Environment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-prod:
    name: Deploy to prod.dataworker.ru
    runs-on: ubuntu-latest
    if: github.repository == 'Electro-Interfaces/TradeControl'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Repository guards
        run: npm run check:repo-guards

      - name: Sync version
        run: npm run sync-version

      - name: Build for PRODUCTION
        run: npm run build:prod
        env:
          VITE_APP_ENV: production
          VITE_API_URL: https://prod.dataworker.ru
          VITE_BASE_URL: https://prod.dataworker.ru
          VITE_AUTH_API_MODE: backend
          VITE_ADMIN_API_MODE: backend
          VITE_ORG_API_MODE: backend
          VITE_AUDIT_API_MODE: backend
          VITE_LEGAL_API_MODE: backend
          VITE_NOMENCLATURE_API_MODE: backend

      - name: Create deployment archive
        run: |
          tar -czf deployment.tar.gz dist/ server/ package.json ecosystem.prod.config.cjs
          ls -lh deployment.tar.gz

      - name: Deploy to PRODUCTION server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deployment.tar.gz"
          target: "/tmp/"

      - name: Execute deployment on PRODUCTION server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "Starting PRODUCTION deployment..."
            cd /var/www/www-root/data/www/prod.dataworker.ru

            # Бэкап текущей версии
            timestamp=$(date +%Y%m%d_%H%M%S)
            mkdir -p /var/backups/tradeframe
            if [ -d "dist" ]; then
              tar -czf /var/backups/tradeframe/prod-backup-${timestamp}.tar.gz dist server || true
              echo "Backup: /var/backups/tradeframe/prod-backup-${timestamp}.tar.gz"
            fi

            # Распаковываем (dist + server + package.json + ecosystem)
            tar -xzf /tmp/deployment.tar.gz
            rm /tmp/deployment.tar.gz
            echo "Build extracted"

            # server/.env — секреты + PG конфигурация
            cat > server/.env << 'ENV_EOF'
            # STS API Configuration
            STS_API_URL=${{ secrets.STS_API_URL }}
            STS_API_USERNAME=${{ secrets.STS_API_USERNAME }}
            STS_API_PASSWORD=${{ secrets.STS_API_PASSWORD }}

            # MSTO API Configuration
            MSTO_API_URL=${{ secrets.MSTO_API_URL }}
            MSTO_USERNAME=${{ secrets.MSTO_USERNAME }}
            MSTO_PASSWORD=${{ secrets.MSTO_PASSWORD }}

            # Server Configuration
            PORT=3001
            NODE_ENV=production
            ALLOWED_ORIGINS=https://prod.dataworker.ru

            # Telegram Bot Configuration
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_BOT_NAME=TradeFrame Notifications
            TELEGRAM_BOT_USERNAME=TradeFrameDW_Bot

            # TradeCorp API Configuration
            TRADECORP_API_URL=${{ secrets.TRADECORP_API_URL }}
            TRADECORP_LOGIN=${{ secrets.TRADECORP_LOGIN }}
            TRADECORP_PASSWORD=${{ secrets.TRADECORP_PASSWORD }}
            TRADECORP_EMITENT_ID=${{ secrets.TRADECORP_EMITENT_ID }}

            # TSupport SDK Configuration
            TSUPPORT_API_URL=${{ secrets.TSUPPORT_API_URL }}
            TSUPPORT_SDK_API_KEY=${{ secrets.TSUPPORT_SDK_API_KEY }}
            TSUPPORT_SDK_SECRET=${{ secrets.TSUPPORT_SDK_SECRET }}

            # PostgreSQL — primary data source
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            AUTH_DATA_SOURCE=pg
            DATA_SOURCE=pg

            # JWT Token Secret
            JWT_SECRET=${{ secrets.JWT_SECRET_PROD }}

            # SMTP — рассылка приказов корректировки остатков (Mailcow)
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_SECURE=${{ secrets.SMTP_SECURE }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
            SMTP_FROM=${{ secrets.SMTP_FROM }}
            ENV_EOF

            # Каталог для PDF-приказов корректировки
            mkdir -p server/uploads/inventory-adjustments
            chmod -R u+rwX server/uploads

            # Устанавливаем зависимости backend
            cd server
            npm install --production

            # Накатываем миграции БД (idempotent)
            npm run db:migrate
            cd ..

            # Перезапуск PM2
            pm2 delete tradeframe-prod-frontend tradeframe-prod-backend || true
            pm2 start ecosystem.prod.config.cjs
            pm2 save

            pm2 list | grep tradeframe-prod

            echo "PRODUCTION deployment completed"
            echo "URL: https://prod.dataworker.ru"

      - name: Verify deployment
        run: |
          sleep 10
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://prod.dataworker.ru)
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "PRODUCTION site responding HTTP 200"
          else
            echo "PRODUCTION site returned HTTP $HTTP_STATUS"
            exit 1
          fi

          # Проверяем что бэкенд отвечает
          API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://prod.dataworker.ru/api/healthz)
          if [ "$API_STATUS" -eq 200 ]; then
            echo "Backend API responding HTTP 200"
          else
            echo "Backend API returned HTTP $API_STATUS"
            exit 1
          fi

      - name: Authenticated smoke test
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/www-root/data/www/prod.dataworker.ru
            node server/scripts/postDeploySmoke.js --base-url=https://prod.dataworker.ru

      - name: Notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "PRODUCTION Deployment SUCCESSFUL — https://prod.dataworker.ru"
          else
            echo "PRODUCTION Deployment FAILED"
          fi
