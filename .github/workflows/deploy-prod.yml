name: Deploy to PRODUCTION Environment

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Позволяет также запускать вручную через UI

jobs:
  deploy-prod:
    name: Deploy to prod.dataworker.ru
    runs-on: ubuntu-latest
    if: github.repository == 'Electro-Interfaces/TradeControl'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync version
        run: npm run sync-version

      - name: Build for PRODUCTION
        run: npm run build:prod
        env:
          VITE_APP_ENV: production
          VITE_API_URL: https://prod.dataworker.ru
          VITE_BASE_URL: https://prod.dataworker.ru
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
          VITE_STS_API_URL: ${{ secrets.VITE_STS_API_URL }}
          VITE_STS_API_USERNAME: ${{ secrets.VITE_STS_API_USERNAME }}
          VITE_STS_API_PASSWORD: ${{ secrets.VITE_STS_API_PASSWORD }}

      - name: Create deployment archive
        run: |
          tar -czf deployment.tar.gz dist/ src/ server/ package.json
          ls -lh deployment.tar.gz

      - name: Deploy to PRODUCTION server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deployment.tar.gz,ecosystem.prod.config.cjs"
          target: "/tmp/"

      - name: Execute deployment on PRODUCTION server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "🔄 Starting PRODUCTION deployment..."
            cd /var/www/www-root/data/www/prod.dataworker.ru

            # Создаем бэкап текущей версии
            timestamp=$(date +%Y%m%d_%H%M%S)
            mkdir -p /tmp/backups
            if [ -d "dist" ]; then
              tar -czf /tmp/backups/prod-backup-${timestamp}.tar.gz dist src server || true
              echo "✅ Backup created: /tmp/backups/prod-backup-${timestamp}.tar.gz"
            fi

            # Распаковываем новую версию (dist, src, server, package.json)
            tar -xzf /tmp/deployment.tar.gz
            rm /tmp/deployment.tar.gz
            echo "✅ New build and source code extracted"

            # Копируем PM2 конфигурацию
            cp /tmp/ecosystem.prod.config.cjs ./
            rm /tmp/ecosystem.prod.config.cjs
            echo "✅ PM2 config updated"

            # Создаем server/.env с переменными окружения
            cat > server/.env << 'ENV_EOF'
            # STS API Configuration
            STS_API_URL=${{ secrets.VITE_STS_API_URL }}
            STS_API_USERNAME=${{ secrets.VITE_STS_API_USERNAME }}
            STS_API_PASSWORD=${{ secrets.VITE_STS_API_PASSWORD }}

            # Server Configuration
            PORT=3001
            NODE_ENV=production
            ALLOWED_ORIGINS=https://prod.dataworker.ru

            # Telegram Bot Configuration
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_BOT_NAME=TradeFrame Notifications
            TELEGRAM_BOT_USERNAME=TradeFrameDW_Bot

            # Supabase Configuration
            SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            SUPABASE_SERVICE_KEY=${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
            ENV_EOF

            # Устанавливаем зависимости для backend
            cd server
            npm install --production
            cd ..

            # Останавливаем старые процессы (если есть)
            pm2 delete tradeframe-prod-frontend tradeframe-prod-backend || true

            # Запускаем процессы с актуальной конфигурацией
            pm2 start ecosystem.prod.config.cjs

            # Сохраняем конфигурацию PM2
            pm2 save

            # Проверяем статус
            pm2 list | grep tradeframe-prod

            echo "✅ PRODUCTION deployment completed!"
            echo "🌐 URL: https://prod.dataworker.ru"

      - name: Verify deployment
        run: |
          echo "⏳ Waiting 10 seconds for services to start..."
          sleep 10

          # Проверяем доступность PRODUCTION сайта
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://prod.dataworker.ru)
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ PRODUCTION site is responding with HTTP 200"
          else
            echo "❌ PRODUCTION site returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ PRODUCTION Deployment SUCCESSFUL"
            echo "🌐 https://prod.dataworker.ru"
          else
            echo "❌ PRODUCTION Deployment FAILED"
          fi
