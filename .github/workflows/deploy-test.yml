name: Deploy to TEST Environment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy-test:
    name: Deploy to testtf.dataworker.ru
    runs-on: ubuntu-latest
    if: github.repository == 'Electro-Interfaces/tradeframe-builder'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Repository guards
        run: npm run check:repo-guards

      - name: Sync version
        run: npm run sync-version

      - name: Build for TEST
        run: npm run build:prod
        env:
          VITE_APP_ENV: testing
          VITE_API_URL: https://testtf.dataworker.ru
          VITE_BASE_URL: https://testtf.dataworker.ru
          VITE_AUTH_API_MODE: backend
          VITE_ADMIN_API_MODE: backend
          VITE_ORG_API_MODE: backend
          VITE_AUDIT_API_MODE: backend
          VITE_LEGAL_API_MODE: backend
          VITE_NOMENCLATURE_API_MODE: backend
          VITE_CHAT_BACKEND: matrix

      - name: Create deployment archive
        run: |
          tar -czf deployment.tar.gz dist/ server/ package.json ecosystem.test.config.cjs
          ls -lh deployment.tar.gz

      - name: Deploy to TEST server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "deployment.tar.gz"
          target: "/tmp/"

      - name: Execute deployment on TEST server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "Starting TEST deployment..."
            cd /var/www/www-root/data/www/testTF.dataworker.ru

            # Бэкап текущей версии
            timestamp=$(date +%Y%m%d_%H%M%S)
            mkdir -p /var/backups/tradeframe
            if [ -d "dist" ]; then
              tar -czf /var/backups/tradeframe/test-backup-${timestamp}.tar.gz dist server || true
              echo "Backup: /var/backups/tradeframe/test-backup-${timestamp}.tar.gz"
            fi

            # Распаковываем (dist + server + package.json + ecosystem)
            tar -xzf /tmp/deployment.tar.gz
            rm /tmp/deployment.tar.gz
            echo "Build extracted"

            # server/.env — секреты + PG конфигурация
            cat > server/.env << 'ENV_EOF'
            # STS API Configuration
            STS_API_URL=${{ secrets.STS_API_URL }}
            STS_API_USERNAME=${{ secrets.STS_API_USERNAME }}
            STS_API_PASSWORD=${{ secrets.STS_API_PASSWORD }}

            # MSTO API Configuration
            MSTO_API_URL=${{ secrets.MSTO_API_URL }}
            MSTO_USERNAME=${{ secrets.MSTO_USERNAME }}
            MSTO_PASSWORD=${{ secrets.MSTO_PASSWORD }}

            # Server Configuration
            PORT=3002
            NODE_ENV=production
            ALLOWED_ORIGINS=https://testtf.dataworker.ru

            # Telegram Bot Configuration
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN_TEST }}
            TELEGRAM_BOT_NAME=TradeFrame Test Notifications
            TELEGRAM_BOT_USERNAME=TradeFrameTest_Bot

            # TSupport SDK Configuration
            TSUPPORT_API_URL=${{ secrets.TSUPPORT_API_URL }}
            TSUPPORT_SDK_API_KEY=${{ secrets.TSUPPORT_SDK_API_KEY }}
            TSUPPORT_SDK_SECRET=${{ secrets.TSUPPORT_SDK_SECRET }}

            # Единый шлюз intake заявок -> Plane SUP (зеркалирование, fire-and-forget).
            # Если SUPPORT_INTAKE_SECRET пуст — эмиссия отключена (канал не активен), TSupport не затронут.
            SUPPORT_INTAKE_URL=https://events.dataworker.ru/api/intake/support
            SUPPORT_INTAKE_SECRET=${{ secrets.SUPPORT_INTAKE_SECRET }}

            # PostgreSQL — primary data source
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            AUTH_DATA_SOURCE=pg
            DATA_SOURCE=pg

            # JWT Token Secret
            JWT_SECRET=${{ secrets.JWT_SECRET_TEST }}

            # SMTP — рассылка приказов корректировки остатков (Mailcow)
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_SECURE=${{ secrets.SMTP_SECURE }}
            SMTP_USER=${{ secrets.SMTP_USER }}
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
            SMTP_FROM=${{ secrets.SMTP_FROM }}

            # TradeLink Integration API — карточка «Связь» (состояние связи станций, read-only)
            TRADELINK_API_URL=https://link.dataworker.ru/api/v1
            TRADELINK_CLIENT_ID=${{ secrets.TRADELINK_CLIENT_ID }}
            TRADELINK_KEY=${{ secrets.TRADELINK_KEY }}

            # Matrix/Synapse — раздел «Чат» (родной UI). MATRIX_ADMIN_TOKEN — секрет (@tf-chat-svc).
            MATRIX_HOMESERVER=https://matrix.dataworker.ru
            MATRIX_SERVER_NAME=matrix.dataworker.ru
            MATRIX_ADMIN_TOKEN=${{ secrets.MATRIX_ADMIN_TOKEN }}
            MATRIX_SUPPORT_MXIDS=@mag:matrix.dataworker.ru,@e.orlova:matrix.dataworker.ru,@d.korolev:matrix.dataworker.ru,@v.krol:matrix.dataworker.ru,@v.ginko:matrix.dataworker.ru,@gavrilov:matrix.dataworker.ru
            MATRIX_NEWS_MODERATOR_MXID=@d.korolev:matrix.dataworker.ru
            ENV_EOF

            # Каталог для PDF-приказов корректировки
            mkdir -p server/uploads/inventory-adjustments
            chmod -R u+rwX server/uploads

            # Устанавливаем зависимости backend
            cd server
            npm install --production

            # Накатываем миграции БД (idempotent)
            npm run db:migrate
            cd ..

            # Перезапуск PM2
            pm2 delete tradeframe-test-frontend tradeframe-test-backend || true
            pm2 start ecosystem.test.config.cjs
            pm2 save

            pm2 list | grep tradeframe-test

            echo "TEST deployment completed"
            echo "URL: https://testtf.dataworker.ru"

      - name: Verify deployment
        run: |
          sleep 5
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://testtf.dataworker.ru)
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "TEST site responding HTTP 200"
          else
            echo "TEST site returned HTTP $HTTP_STATUS"
            exit 1
          fi

          API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://testtf.dataworker.ru/api/healthz)
          if [ "$API_STATUS" -eq 200 ]; then
            echo "Backend API responding HTTP 200"
          else
            echo "Backend API returned HTTP $API_STATUS"
            exit 1
          fi

      - name: Authenticated smoke test
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /var/www/www-root/data/www/testTF.dataworker.ru
            node server/scripts/postDeploySmoke.js --base-url=https://testtf.dataworker.ru

      - name: Notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "TEST Deployment SUCCESSFUL — https://testtf.dataworker.ru"
          else
            echo "TEST Deployment FAILED"
          fi
