name: Deploy to TEST Environment

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Позволяет запускать вручную через UI

jobs:
  deploy-test:
    name: Deploy to testtf.dataworker.ru
    runs-on: ubuntu-latest
    if: github.repository == 'Electro-Interfaces/tradeframe-builder'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync version
        run: npm run sync-version

      - name: Build for TEST
        run: npm run build:prod
        env:
          VITE_APP_ENV: testing
          VITE_API_URL: https://testtf.dataworker.ru
          VITE_BASE_URL: https://testtf.dataworker.ru
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
          VITE_STS_API_URL: ${{ secrets.VITE_STS_API_URL }}
          VITE_STS_API_USERNAME: ${{ secrets.VITE_STS_API_USERNAME }}
          VITE_STS_API_PASSWORD: ${{ secrets.VITE_STS_API_PASSWORD }}

      - name: Create deployment archive
        run: |
          tar -czf dist.tar.gz dist/
          ls -lh dist.tar.gz

      - name: Deploy to TEST server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "dist.tar.gz"
          target: "/tmp/"

      - name: Execute deployment on TEST server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.REMOTE_HOST }}
          username: ${{ secrets.REMOTE_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            echo "🔄 Starting TEST deployment..."
            cd /var/www/www-root/data/www/testTF.dataworker.ru

            # Создаем бэкап текущей версии
            timestamp=$(date +%Y%m%d_%H%M%S)
            mkdir -p /tmp/backups
            if [ -d "dist" ]; then
              tar -czf /tmp/backups/test-backup-${timestamp}.tar.gz dist || true
              echo "✅ Backup created: /tmp/backups/test-backup-${timestamp}.tar.gz"
            fi

            # Распаковываем новую версию
            rm -rf dist
            tar -xzf /tmp/dist.tar.gz
            rm /tmp/dist.tar.gz
            echo "✅ New build extracted"

            # Обновляем код из git
            git pull origin main || echo "Git pull failed, continuing..."

            # Создаем server/.env с переменными окружения
            cat > server/.env << 'ENV_EOF'
            # STS API Configuration
            STS_API_URL=${{ secrets.VITE_STS_API_URL }}
            STS_API_USERNAME=${{ secrets.VITE_STS_API_USERNAME }}
            STS_API_PASSWORD=${{ secrets.VITE_STS_API_PASSWORD }}

            # Server Configuration
            PORT=3002
            NODE_ENV=production
            ALLOWED_ORIGINS=https://testtf.dataworker.ru

            # Telegram Bot Configuration
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            TELEGRAM_BOT_NAME=TradeFrame Notifications
            TELEGRAM_BOT_USERNAME=TradeFrameDW_Bot

            # Supabase Configuration
            SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            SUPABASE_SERVICE_KEY=${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
            ENV_EOF

            # Устанавливаем зависимости для backend
            cd server
            npm install --production
            cd ..

            # Останавливаем старые процессы (если есть)
            pm2 delete tradeframe-test-frontend tradeframe-test-backend || true

            # Запускаем процессы с актуальной конфигурацией
            pm2 start ecosystem.test.config.cjs

            # Сохраняем конфигурацию PM2
            pm2 save

            # Проверяем статус
            pm2 list | grep tradeframe-test

            echo "✅ TEST deployment completed!"
            echo "🌐 URL: https://testtf.dataworker.ru"

      - name: Verify deployment
        run: |
          echo "⏳ Waiting 5 seconds for services to start..."
          sleep 5

          # Проверяем доступность TEST сайта
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://testtf.dataworker.ru)
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ TEST site is responding with HTTP 200"
          else
            echo "❌ TEST site returned HTTP $HTTP_STATUS"
            exit 1
          fi

      - name: Notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ TEST Deployment SUCCESSFUL"
            echo "🌐 https://testtf.dataworker.ru"
          else
            echo "❌ TEST Deployment FAILED"
          fi
