name: Deploy production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build

    env:
        PROD_ADDRESS: ${{secrets.PROD_ADDRESS}}
        PROD_USER: ${{secrets.PROD_USER}}
        PROD_PASS: ${{secrets.PROD_PASS}}
        PROD_PORT: ${{secrets.PROD_PORT}}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy files via rsync over SSH
        uses: appleboy/ssh-action@v1.1.0
        with:
            host: ${{env.PROD_ADDRESS}}
            username: ${{env.PROD_USER}}
            password: ${{env.PROD_PASS}}
            port: ${{env.PROD_PORT}}
            script: |
                  TARGET_DIR="/var/www/www-root/data/www/prod.dataworker.ru"
                  cd $TARGET_DIR

                  # Останавливаем PM2 процессы перед обновлением
                  pm2 stop tradeframe-prod || true
                  pm2 stop tradeframe-backend-proxy || true

      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{env.PROD_ADDRESS}}
          username: ${{env.PROD_USER}}
          password: ${{env.PROD_PASS}}
          port: ${{env.PROD_PORT}}
          source: "dist/,server/,ecosystem.config.cjs,package.json,package-lock.json"
          target: "/tmp/tradeframe-deploy"
          strip_components: 0
          overwrite: true
          rm: true

      - name: Move files and restart services
        uses: appleboy/ssh-action@v1.1.0
        with:
            host: ${{env.PROD_ADDRESS}}
            username: ${{env.PROD_USER}}
            password: ${{env.PROD_PASS}}
            port: ${{env.PROD_PORT}}
            script: |
                  TARGET_DIR="/var/www/www-root/data/www/prod.dataworker.ru"
                  TEMP_DIR="/tmp/tradeframe-deploy"

                  # Удаляем старый dist
                  rm -rf $TARGET_DIR/dist

                  # Копируем новые файлы из временной директории
                  cp -rf $TEMP_DIR/* $TARGET_DIR/

                  # Удаляем временную директорию
                  rm -rf $TEMP_DIR

                  cd $TARGET_DIR

                  # Backend Proxy - устанавливаем зависимости
                  if [ -d "server" ] && [ -f "server/package.json" ]; then
                    cd server
                    npm ci --no-fund --no-audit
                    cd ..
                  fi

                  # Перезапуск PM2 процессов
                  pm2 restart tradeframe-prod || pm2 start ecosystem.config.cjs --only tradeframe-prod
                  pm2 restart tradeframe-backend-proxy || pm2 start ecosystem.config.cjs --only tradeframe-backend-proxy

                  # Показываем статус PM2
                  pm2 list
