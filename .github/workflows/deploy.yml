name: Deploy production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build
        run: npm run build
        
  deploy:
    runs-on: ubuntu-latest
    needs: build

    env:
        PROD_ADDRESS: ${{secrets.PROD_ADDRESS}}
        PROD_USER: ${{secrets.PROD_USER}}
        PROD_PASS: ${{secrets.PROD_PASS}}
        PROD_PORT: ${{secrets.PROD_PORT}}

    steps:
      - name: connect to server and deploy
        uses: appleboy/ssh-action@v1.1.0
        with:
            host: ${{env.PROD_ADDRESS}}
            username: ${{env.PROD_USER}}
            password: ${{env.PROD_PASS}}
            port: ${{env.PROD_PORT}}
            script: |
                  cd /var/www/www-root/data/www/prod.dataworker.ru

                  # Проверка текущего пользователя и прав
                  echo "Current user: $(whoami)"
                  echo "Directory owner: $(stat -c '%U' .)"

                  # Проверяем есть ли права на запись
                  if [ ! -w . ]; then
                    echo "No write permissions in current directory"
                    echo "Attempting to fix permissions..."

                    # Пробуем через sudo с NOPASSWD (если настроено в sudoers)
                    if sudo -n chown -R $(whoami):$(whoami) . 2>/dev/null; then
                      echo "Permissions fixed successfully"
                    else
                      echo "Cannot fix permissions. Please run on server:"
                      echo "sudo chown -R $(whoami):$(whoami) /var/www/www-root/data/www/prod.dataworker.ru"
                      exit 1
                    fi
                  fi

                  # Сброс локальных изменений и обновление из git
                  git reset --hard HEAD
                  git clean -fd
                  git pull --rebase

                  # Установка зависимостей и сборка
                  npm ci --no-fund --no-audit
                  npm run build

                  # Backend Proxy
                  cd server
                  npm ci --no-fund --no-audit
                  cd ..

                  # Перезапуск PM2 процессов
                  pm2 restart tradeframe-prod || pm2 start ecosystem.config.cjs --only tradeframe-prod
                  pm2 restart tradeframe-backend-proxy || pm2 start ecosystem.config.cjs --only tradeframe-backend-proxy

                  # Показываем статус PM2
                  pm2 list
