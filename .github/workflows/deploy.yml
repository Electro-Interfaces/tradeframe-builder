name: Deploy production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  deploy:
    runs-on: ubuntu-latest
    needs: build

    env:
        PROD_ADDRESS: ${{secrets.PROD_ADDRESS}}
        PROD_ROOT_USER: root
        PROD_PASS: ${{secrets.PROD_PASS}}
        PROD_PORT: ${{secrets.PROD_PORT}}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Clean old files on server (as root)
        uses: appleboy/ssh-action@v1.1.0
        with:
            host: ${{env.PROD_ADDRESS}}
            username: ${{env.PROD_ROOT_USER}}
            password: ${{env.PROD_PASS}}
            port: ${{env.PROD_PORT}}
            script: |
                  cd /var/www/www-root/data/www/prod.dataworker.ru

                  # Удаляем старую сборку полностью
                  rm -rf dist

                  # Удаляем старые package файлы
                  rm -f package.json package-lock.json

                  # Создаем пустую директорию dist с правильным владельцем
                  mkdir -p dist
                  chown -R www-root:www-root dist

      - name: Deploy via SCP (as root)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{env.PROD_ADDRESS}}
          username: ${{env.PROD_ROOT_USER}}
          password: ${{env.PROD_PASS}}
          port: ${{env.PROD_PORT}}
          source: "dist/,server/,ecosystem.config.cjs,package.json,package-lock.json"
          target: "/var/www/www-root/data/www/prod.dataworker.ru"
          strip_components: 0
          overwrite: true

      - name: Fix permissions and restart services (as root)
        uses: appleboy/ssh-action@v1.1.0
        with:
            host: ${{env.PROD_ADDRESS}}
            username: ${{env.PROD_ROOT_USER}}
            password: ${{env.PROD_PASS}}
            port: ${{env.PROD_PORT}}
            script: |
                  cd /var/www/www-root/data/www/prod.dataworker.ru

                  # Исправляем владельца всех файлов
                  chown -R www-root:www-root .

                  # Backend Proxy - устанавливаем зависимости
                  if [ -d "server" ] && [ -f "server/package.json" ]; then
                    cd server
                    npm ci --no-fund --no-audit
                    cd ..
                  else
                    echo "Warning: server directory not found or invalid"
                  fi

                  # Перезапуск PM2 процессов от пользователя www-root
                  su - www-root -c "cd /var/www/www-root/data/www/prod.dataworker.ru && pm2 restart tradeframe-prod || pm2 start ecosystem.config.cjs --only tradeframe-prod"
                  su - www-root -c "cd /var/www/www-root/data/www/prod.dataworker.ru && pm2 restart tradeframe-backend-proxy || pm2 start ecosystem.config.cjs --only tradeframe-backend-proxy"

                  # Показываем статус PM2
                  su - www-root -c "pm2 list"
