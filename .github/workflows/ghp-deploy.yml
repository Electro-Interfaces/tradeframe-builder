name: Deploy GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Create production environment file
        run: |
          cat > .env.production << EOF
          # Production environment variables
          VITE_DISABLE_PDF_EXPORT=true

          # STS API Configuration
          VITE_STS_API_URL=${{ secrets.VITE_STS_API_URL }}
          VITE_STS_API_USERNAME=${{ secrets.VITE_STS_API_USERNAME }}
          VITE_STS_API_PASSWORD=${{ secrets.VITE_STS_API_PASSWORD }}

          # Supabase Configuration
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_SERVICE_ROLE_KEY=${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
          EOF
          echo "Created .env.production file"
          echo "Checking if secrets are loaded:"
          if [ -z "${{ secrets.VITE_STS_API_URL }}" ]; then echo "WARNING: VITE_STS_API_URL is empty"; fi
          if [ -z "${{ secrets.VITE_SUPABASE_URL }}" ]; then echo "WARNING: VITE_SUPABASE_URL is empty"; fi

      - name: Build project
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
